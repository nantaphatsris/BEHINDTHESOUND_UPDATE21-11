<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign Up | Behind The Sound</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
/* ========================================
   BEHIND THE SOUND
   AUTHENTICATION PAGES
   DARK GOLD THEME
======================================== */

:root {
  --bg: #100e0c;
  --panel: #191512;
  --panel-light: #211b16;

  --orange: #ff9d43;
  --gold: #e8a04d;

  --text: #f4e7d9;
  --muted: #b9a99a;

  --border: rgba(255, 157, 67, 0.25);
  --error: #ff7777;
  --success: #8ed6a0;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(255, 157, 67, 0.10),
      transparent 40%
    ),
    var(--bg);

  color: var(--text);

  font-family: 'Kanit', sans-serif;
}

/* PAGE */

.auth-page {
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 80px 20px 40px;

  position: relative;
}

/* BACK HOME */

.back-home {
  position: absolute;
  top: 30px;
  left: 40px;

  color: var(--muted);
  text-decoration: none;

  font-size: 14px;

  transition: 0.3s;
}

.back-home:hover {
  color: var(--orange);
}

/* AUTH CARD */

.auth-card {
  width: 100%;
  max-width: 450px;

  padding: 42px 40px;

  background: rgba(25, 21, 18, 0.96);

  border: 1px solid var(--border);
  border-radius: 20px;

  box-shadow:
    0 0 60px rgba(255, 157, 67, 0.07),
    0 20px 60px rgba(0, 0, 0, 0.3);
}

.signup-card {
  max-width: 480px;
}

/* LOGO */

.auth-logo {
  display: block;

  text-align: center;

  color: var(--text);

  font-family: 'Montserrat', sans-serif;
  font-size: 17px;
  font-weight: 800;

  letter-spacing: 1px;

  text-decoration: none;

  margin-bottom: 38px;
}

.auth-logo span {
  color: var(--orange);
}

/* HEADING */

.auth-heading {
  text-align: center;
  margin-bottom: 32px;
}

.eyebrow {
  color: var(--orange);

  font-family: 'Montserrat', sans-serif;
  font-size: 10px;
  font-weight: 700;

  letter-spacing: 3px;

  margin-bottom: 10px;
}

.auth-heading h1 {
  font-family: 'Montserrat', sans-serif;

  font-size: 30px;
  font-weight: 800;

  margin-bottom: 10px;
}

.subtitle {
  color: var(--muted);

  font-size: 14px;
  font-weight: 300;

  line-height: 1.7;
}

/* FORM */

.form-group {
  margin-bottom: 22px;
}

.form-group label {
  display: block;

  color: var(--text);

  font-size: 14px;
  font-weight: 400;

  margin-bottom: 9px;
}

.form-group input {
  width: 100%;
  height: 49px;

  padding: 0 15px;

  background: #100e0c;

  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9px;

  outline: none;

  color: var(--text);

  font-family: 'Kanit', sans-serif;
  font-size: 14px;

  transition: 0.3s;
}

.form-group input::placeholder {
  color: #766c62;
}

.form-group input:focus {
  border-color: var(--orange);

  box-shadow:
    0 0 0 3px rgba(255, 157, 67, 0.08);
}

/* LABEL ROW */

.label-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.text-button {
  background: none;
  border: none;

  color: var(--orange);

  font-family: 'Kanit', sans-serif;
  font-size: 12px;

  cursor: pointer;

  transition: 0.3s;
}

.text-button:hover {
  color: var(--gold);
  text-decoration: underline;
}

/* MESSAGE */

.form-message {
  min-height: 20px;

  margin: 5px 0 15px;

  font-size: 13px;
  line-height: 1.6;

  color: var(--error);
}

.form-message.success {
  color: var(--success);
}

/* BUTTON */

.auth-button {
  width: 100%;
  height: 50px;

  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;

  background: linear-gradient(
    120deg,
    #ff9d43,
    #e8a04d
  );

  border: none;
  border-radius: 9px;

  color: #1b120a;

  font-family: 'Montserrat', sans-serif;
  font-size: 14px;
  font-weight: 800;

  cursor: pointer;

  transition: 0.3s;
}

.auth-button span {
  font-size: 19px;
}

.auth-button:hover {
  transform: translateY(-2px);

  box-shadow:
    0 8px 25px rgba(255, 157, 67, 0.2);
}

.auth-button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

/* DIVIDER */

.auth-divider {
  display: flex;
  align-items: center;
  gap: 15px;

  margin: 27px 0;

  color: #75695e;

  font-family: 'Montserrat', sans-serif;
  font-size: 10px;
  font-weight: 600;
}

.auth-divider::before,
.auth-divider::after {
  content: "";

  flex: 1;

  height: 1px;

  background: rgba(255, 255, 255, 0.1);
}

/* SWITCH AUTH */

.switch-auth {
  text-align: center;

  color: var(--muted);

  font-size: 14px;
}

.switch-auth a {
  color: var(--orange);

  font-weight: 500;

  text-decoration: none;

  margin-left: 4px;
}

.switch-auth a:hover {
  text-decoration: underline;
}

/* FOOTER */

.auth-footer {
  margin-top: 35px;

  text-align: center;

  color: #74675b;

  font-family: 'Montserrat', sans-serif;
  font-size: 9px;

  letter-spacing: 2px;
}

/* RESPONSIVE */

@media (max-width: 600px) {

  .auth-page {
    padding: 85px 16px 30px;
  }

  .back-home {
    top: 25px;
    left: 20px;
  }

  .auth-card {
    padding: 35px 23px;
  }

  .auth-heading h1 {
    font-size: 25px;
  }

}
</style>
</head>

<body>

  <main class="auth-page">


    <section class="auth-card signup-card">

      <a href="index.html" class="auth-logo">
        BEHIND <span>THE SOUND</span>
      </a>

      <div class="auth-heading">
        <p class="eyebrow">START YOUR JOURNEY</p>
        <h1>Create Account</h1>
        <p class="subtitle">
          Join us and discover the art behind every sound.
        </p>
      </div>

      <form id="signupForm">

        <div class="form-group">
          <label for="fullName">Full Name</label>

          <input
            type="text"
            id="fullName"
            placeholder="Enter your name"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            placeholder="Create a password (at least 6 characters)"
            autocomplete="new-password"
            minlength="6"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>

          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            autocomplete="new-password"
            required
          >
        </div>

        <p id="formMessage" class="form-message"></p>

        <button type="submit" class="auth-button">
          Create Account
          <span>→</span>
        </button>

      </form>

      <div class="auth-divider">
        <span>OR</span>
      </div>

      <p class="switch-auth">
        Already have an account?
        <a href="login.html">Log In</a>
      </p>


    </section>

  </main>

  <script type="module">
// ========================================
// BEHIND THE SOUND
// AUTHENTICATION SYSTEM
// Firebase Authentication + Firestore
// ========================================

import { auth, db } from "./firebase-config.js";

import {
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  updateProfile,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// ========================================
// SETTINGS
// ========================================

// หลัง Login หรือ Sign Up สำเร็จ
// ให้กลับไปหน้า Landing Page ก่อน
// สามารถเปลี่ยนเป็นหน้าอื่นได้ภายหลัง

const AFTER_AUTH_URL = "home.html";


// ========================================
// ELEMENTS
// ========================================

const loginForm = document.getElementById("loginForm");
const signupForm = document.getElementById("signupForm");

const formMessage = document.getElementById("formMessage");


// ========================================
// MESSAGE FUNCTION
// ========================================

function showMessage(message, type = "error") {

  if (!formMessage) return;

  formMessage.textContent = message;

  formMessage.className = "form-message";

  if (type === "success") {
    formMessage.classList.add("success");
  }

}


// ========================================
// FIREBASE ERROR TRANSLATION
// ========================================

function getErrorMessage(error) {

  const errorCode = error.code;

  const messages = {

    "auth/invalid-email":
      "รูปแบบอีเมลไม่ถูกต้อง",

    "auth/user-not-found":
      "ไม่พบบัญชีผู้ใช้นี้",

    "auth/wrong-password":
      "รหัสผ่านไม่ถูกต้อง",

    "auth/invalid-credential":
      "อีเมลหรือรหัสผ่านไม่ถูกต้อง",

    "auth/email-already-in-use":
      "อีเมลนี้ถูกใช้งานแล้ว",

    "auth/weak-password":
      "รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร",

    "auth/network-request-failed":
      "ไม่สามารถเชื่อมต่ออินเทอร์เน็ตได้",

    "auth/too-many-requests":
      "มีการลองเข้าสู่ระบบหลายครั้งเกินไป กรุณาลองใหม่ภายหลัง",

    "auth/missing-password":
      "กรุณากรอกรหัสผ่าน"

  };

  return messages[errorCode] ||
    "เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง";

}


// ========================================
// SIGN UP
// ========================================

if (signupForm) {

  signupForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    const fullName =
      document.getElementById("fullName").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;

    const submitButton =
      signupForm.querySelector("button[type='submit']");


    // Check empty name

    if (!fullName) {
      showMessage("กรุณากรอกชื่อของคุณ");
      return;
    }


    // Check password length

    if (password.length < 6) {
      showMessage("รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร");
      return;
    }


    // Check password confirmation

    if (password !== confirmPassword) {
      showMessage("รหัสผ่านทั้งสองช่องไม่ตรงกัน");
      return;
    }


    try {

      submitButton.disabled = true;
      submitButton.textContent = "Creating Account...";

      showMessage("กำลังสร้างบัญชี...", "success");


      // Create Firebase Authentication account

      const userCredential =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

      const user = userCredential.user;


      // Save display name to Firebase Authentication

      await updateProfile(user, {
        displayName: fullName
      });


      // Save user profile to Firestore

      await setDoc(doc(db, "users", user.uid), {

        uid: user.uid,

        displayName: fullName,

        email: email,

        createdAt: serverTimestamp()

      });


      showMessage("สมัครสมาชิกสำเร็จ กำลังเข้าสู่เว็บไซต์...", "success");


      // Redirect

      setTimeout(() => {
        window.location.href = AFTER_AUTH_URL;
      }, 1000);


    } catch (error) {

      console.error("Signup error:", error);

      showMessage(getErrorMessage(error));

      submitButton.disabled = false;
      submitButton.innerHTML =
        'Create Account <span>→</span>';

    }

  });

}



// ========================================
// LOG IN
// ========================================

if (loginForm) {

  loginForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const submitButton =
      loginForm.querySelector("button[type='submit']");


    try {

      submitButton.disabled = true;
      submitButton.textContent = "Logging In...";

      showMessage("กำลังเข้าสู่ระบบ...", "success");


      // Sign in with Firebase Authentication

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


      showMessage("เข้าสู่ระบบสำเร็จ กำลังเข้าสู่เว็บไซต์...", "success");


      // Redirect

      setTimeout(() => {
        window.location.href = AFTER_AUTH_URL;
      }, 1000);


    } catch (error) {

      console.error("Login error:", error);

      showMessage(getErrorMessage(error));

      submitButton.disabled = false;
      submitButton.innerHTML =
        'Log In <span>→</span>';

    }

  });

}



// ========================================
// FORGOT PASSWORD
// ========================================

const forgotPasswordButton =
  document.getElementById("forgotPassword");


if (forgotPasswordButton) {

  forgotPasswordButton.addEventListener("click", async () => {

    const email =
      document.getElementById("email").value.trim();


    if (!email) {

      showMessage("กรุณากรอกอีเมลก่อนกด Forgot password");

      document.getElementById("email").focus();

      return;

    }


    try {

      await sendPasswordResetEmail(auth, email);

      showMessage(
        "ส่งลิงก์รีเซ็ตรหัสผ่านไปยังอีเมลแล้ว กรุณาตรวจสอบกล่องจดหมาย",
        "success"
      );

    } catch (error) {

      console.error("Password reset error:", error);

      showMessage(getErrorMessage(error));

    }

  });

}
</script>

</body>
</html>
