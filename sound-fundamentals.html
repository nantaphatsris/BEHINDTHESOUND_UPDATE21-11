  <style>

/* =========================================
   BEHIND THE SOUND
   SOUND FUNDAMENTALS
   DARK GOLD THEME
========================================= */

:root {
  --bg: #100e0c;
  --panel: #211d18;
  --panel-light: #29241e;
  --orange: #ff9d43;
  --gold: #e8a04d;
  --text: #f4e7d9;
  --muted: #c6b7a9;
  --border: rgba(255,157,67,.3);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  overflow-x: hidden;

  background:
    radial-gradient(
      ellipse at 50% 35%,
      rgba(192,95,25,.08),
      transparent 60%
    ),
    #100e0c;

  color: var(--text);
  font-family: 'Kanit', sans-serif;
}

button, a {
  font: inherit;
}


/* =========================================
   HEADER
========================================= */

.fundamentals-header {
  width: 100%;
  height: 75px;
  padding: 0 30px;

  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;

  background: rgba(20,17,14,.97);
  border-bottom: 1px solid var(--border);

  position: sticky;
  top: 0;
  z-index: 100;
}

.back-button {
  justify-self: start;

  width: 42px;
  height: 45px;

  border: none;
  background: transparent;

  color: var(--orange);
  font-size: 38px;
  font-weight: 300;

  cursor: pointer;
  transition: .2s;
}

.back-button:hover {
  color: #ffd09c;
  transform: translateX(-3px);
}

.header-title {
  color: var(--text);
  font-family: 'Montserrat', sans-serif;
  font-size: 18px;
  font-weight: 600;
}

.header-space {
  width: 42px;
}


/* =========================================
   MAIN CONTAINER
========================================= */

.fundamentals-container {
  width: 100%;
  max-width: 1200px;

  margin: auto;
  padding: 65px 45px 50px;
}


/* =========================================
   PAGE HEADING
========================================= */

.page-heading {
  margin-bottom: 35px;
}

.page-heading h1 {
  color: var(--orange);

  font-family: 'Montserrat', sans-serif;
  font-size: clamp(34px, 5vw, 52px);
  font-weight: 800;
  letter-spacing: -1.5px;
}


/* =========================================
   TOPIC CARDS
========================================= */

.topic-list {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.topic-card {
  position: relative;

  width: 100%;
  min-height: 155px;

  padding: 30px 35px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  background:
    linear-gradient(
      145deg,
      rgba(46,39,31,.98),
      rgba(25,22,18,.98)
    );

  border: 1px solid var(--border);
  border-radius: 18px;

  text-decoration: none;
  color: var(--text);

  transition: .3s;
}

.topic-card:hover {
  border-color: var(--orange);
  background:
    linear-gradient(
      145deg,
      rgba(65,48,33,.98),
      rgba(30,24,18,.98)
    );

  transform: translateY(-3px);
  box-shadow: 0 12px 30px rgba(0,0,0,.3);
}

.topic-card h2 {
  color: #f4bd87;

  font-family: 'Montserrat', sans-serif;
  font-size: clamp(21px, 3vw, 28px);
  font-weight: 700;
}

.topic-arrow {
  color: var(--orange);
  font-size: 42px;
  font-weight: 300;

  transition: .2s;
}

.topic-card:hover .topic-arrow {
  transform: translateX(6px);
}


/* =========================================
   LESSON CONTENT
========================================= */

.lesson-page-heading {
  margin-bottom: 28px;
}

.lesson-page-heading h1 {
  color: var(--orange);

  font-family: 'Montserrat', sans-serif;
  font-size: clamp(30px, 5vw, 43px);
  font-weight: 800;
}

.content-card {
  padding: 28px 30px;
  margin-bottom: 20px;

  background: rgba(40,39,32,.97);

  border: 1px solid var(--border);
  border-radius: 16px;

  box-shadow: 0 8px 22px rgba(0,0,0,.16);
}

.content-card h3 {
  margin-bottom: 15px;

  color: var(--orange);
  font-size: 20px;
  font-weight: 500;
}

.content-card h4 {
  margin: 20px 0 10px;

  color: #e7c49d;
  font-size: 16px;
  font-weight: 500;
}

.content-card p {
  margin-bottom: 14px;

  color: #e3d9cd;
  font-size: 14px;
  font-weight: 300;
  line-height: 1.95;
}

.content-card p:last-child {
  margin-bottom: 0;
}


/* =========================================
   EVERYDAY SOUND
========================================= */

.everyday-item {
  padding: 14px 17px;
  margin-top: 13px;

  background: rgba(255,255,255,.025);

  border-left: 3px solid var(--gold);
  border-radius: 5px 10px 10px 5px;
}

.everyday-item h4 {
  margin: 0 0 7px;
  color: #edbd85;
}

.everyday-item p {
  margin: 0;
}


/* =========================================
   FUN FACT
========================================= */

.fact-card {
  padding: 26px 30px;
  margin-bottom: 20px;

  background:
    linear-gradient(
      135deg,
      rgba(111,70,34,.25),
      rgba(40,39,32,.97)
    );

  border: 1px solid rgba(255,173,89,.6);
  border-radius: 16px;
}

.fact-label {
  margin-bottom: 13px;

  color: var(--orange);

  font-family: 'Montserrat', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
}

.fact-card h3 {
  margin-bottom: 13px;
  color: #ffd09c;
  font-size: 18px;
  font-weight: 500;
}

.fact-card p {
  color: #e3d9cd;
  font-size: 14px;
  font-weight: 300;
  line-height: 1.95;
}


/* =========================================
   FREQUENCY TABLE
========================================= */

.frequency-table {
  margin-top: 20px;

  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}

.frequency-row {
  display: flex;
  justify-content: space-between;
  align-items: center;

  gap: 15px;
  padding: 17px 20px;

  border-bottom: 1px solid rgba(232,160,77,.2);

  color: #e8ded2;
  font-size: 14px;
}

.frequency-row:last-child {
  border-bottom: none;
}

.frequency-row:nth-child(odd) {
  background: rgba(255,255,255,.025);
}

.frequency-row strong {
  color: var(--orange);
  font-family: 'Montserrat', sans-serif;
  font-size: 13px;
  text-align: right;
}


/* =========================================
   WAVEFORM DIAGRAM
========================================= */

.diagram-card {
  overflow: hidden;
}

.wave-diagram {
  width: 100%;
  margin-top: 20px;
  padding: 20px 14px;

  background-color: rgba(16,14,12,.65);

  background-image:
    repeating-linear-gradient(
      90deg,
      transparent 0,
      transparent 29px,
      rgba(255,173,89,.08) 30px
    ),
    repeating-linear-gradient(
      0deg,
      transparent 0,
      transparent 29px,
      rgba(255,173,89,.08) 30px
    );

  border: 1px solid rgba(232,160,77,.25);
  border-radius: 12px;
}

.wave-diagram svg {
  display: block;
  width: 100%;
  height: auto;
}

.diagram-caption {
  margin-top: 12px;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}


/* =========================================
   WAVEFORM COMPONENTS
========================================= */

.component-item {
  padding: 17px 0;
  border-bottom: 1px solid rgba(232,160,77,.2);
}

.component-item:first-child {
  padding-top: 0;
}

.component-item:last-child {
  padding-bottom: 0;
  border-bottom: none;
}

.component-item h3 {
  margin-bottom: 8px;
  font-size: 17px;
}


/* =========================================
   WAVEFORM TYPES
========================================= */

.waveform-types-section {
  margin-top: 20px;
}

.waveform-types-section > p {
  margin-bottom: 15px;
}

.waveform-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 13px;
  margin-top: 20px;
}

.wave-type {
  min-width: 0;
  padding: 17px 10px;

  background: rgba(255,255,255,.025);

  border: 1px solid var(--border);
  border-radius: 13px;

  color: var(--text);
  cursor: pointer;

  transition: .2s;
}

.wave-type:hover {
  background: rgba(255,173,89,.08);
  border-color: var(--orange);
  transform: translateY(-3px);
}

.wave-type.playing {
  background: rgba(255,173,89,.14);
  border-color: var(--orange);
  box-shadow: 0 0 15px rgba(255,173,89,.18);
}

.wave-type-name {
  display: block;
  margin-bottom: 15px;

  color: #edbd85;
  font-family: 'Montserrat', sans-serif;
  font-size: 12px;
  font-weight: 600;
}

.wave-type svg {
  display: block;
  width: 100%;
  height: auto;
}

.wave-play-hint {
  display: block;
  margin-top: 12px;
  color: var(--muted);
  font-size: 10px;
}


/* =========================================
   FOOTER
========================================= */

.lesson-footer {
  margin-top: 45px;
  padding: 20px 0;

  border-top: 1px solid var(--border);

  color: #867767;
  font-family: 'Montserrat', sans-serif;
  font-size: 10px;
  letter-spacing: 1px;
  text-align: center;
}


/* =========================================
   RESPONSIVE TABLET
========================================= */

@media (max-width: 800px) {

  .fundamentals-container {
    padding: 55px 30px 40px;
  }

  .waveform-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

}


/* =========================================
   RESPONSIVE MOBILE
========================================= */

@media (max-width: 600px) {

  .fundamentals-header {
    height: 65px;
    padding: 0 16px;
  }

  .header-title {
    font-size: 14px;
  }

  .fundamentals-container {
    padding: 40px 17px 35px;
  }

  .page-heading {
    margin-bottom: 25px;
  }

  .page-heading h1 {
    font-size: 30px;
  }

  .topic-list {
    gap: 14px;
  }

  .topic-card {
    min-height: 115px;
    padding: 23px 22px;
    border-radius: 14px;
  }

  .topic-card h2 {
    font-size: 19px;
  }

  .topic-arrow {
    font-size: 35px;
  }

  .content-card,
  .fact-card {
    padding: 22px 18px;
    border-radius: 13px;
  }

  .content-card h3 {
    font-size: 17px;
  }

  .content-card p,
  .fact-card p {
    font-size: 13px;
    line-height: 1.9;
  }

  .frequency-row {
    padding: 14px 12px;
    font-size: 12px;
  }

  .frequency-row strong {
    font-size: 10px;
  }

  .wave-diagram {
    padding: 10px 2px;
  }

  .waveform-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 9px;
  }

  .wave-type {
    padding: 14px 8px;
  }

  .wave-type-name {
    font-size: 11px;
  }

}

@media (max-width: 350px) {

  .frequency-row {
    flex-direction: column;
    align-items: flex-start;
  }

  .frequency-row strong {
    text-align: left;
  }

}

</style>

const lessons = {

  /* =====================================
     WHAT IS SOUND
  ====================================== */

  sound: `

    <div class="lesson-page-heading">
      <h1>What is Sound?</h1>
    </div>

    <article class="content-card">

      <h3>Sound (เสียง)</h3>

      <h4>เสียงเกิดขึ้นได้อย่างไร?</h4>

      <p>
        เสียง (Sound) คือพลังงานรูปแบบหนึ่งที่เกิดจากการสั่นสะเทือนของวัตถุ
        และเดินทางผ่านตัวกลาง เช่น อากาศ น้ำ และของแข็ง ในรูปแบบของคลื่นเสียง
      </p>

      <p>
        เมื่อวัตถุเกิดการสั่นสะเทือน จะทำให้อนุภาคของตัวกลางเกิดการอัดตัวและขยายตัวสลับกันอย่างต่อเนื่อง
        เกิดเป็นคลื่นเสียงที่เคลื่อนที่ผ่านตัวกลาง เมื่อคลื่นเสียงเดินทางมาถึงหูของเรา
        เราจึงสามารถรับรู้และได้ยินเสียงนั้นได้
      </p>

      <h4>เสียงเดินทางผ่านตัวกลางชนิดใดได้ดีที่สุด?</h4>

      <p>
        เสียงสามารถเดินทางผ่านของแข็งได้เร็วกว่าในของเหลวและแก๊สโดยทั่วไป
        เนื่องจากอนุภาคในของแข็งอยู่ใกล้ชิดกัน ทำให้สามารถส่งผ่านการสั่นสะเทือนจากอนุภาคหนึ่งไปยังอีกอนุภาคหนึ่งได้อย่างรวดเร็ว
      </p>

      <p>
        ในขณะที่ของเหลวและแก๊สมีระยะห่างระหว่างอนุภาคมากกว่า
        จึงส่งผ่านการสั่นสะเทือนได้ช้ากว่า
      </p>

      <h4>Sound in Everyday Life</h4>

      <p>
        เสียงรอบตัวเราเกิดจากการสั่นสะเทือนของวัตถุที่แตกต่างกัน เช่น
      </p>

      <div class="everyday-item">
        <h4>เสียงเคาะประตู (Knocking)</h4>
        <p>
          เกิดจากการกระทบกันระหว่างมือกับประตู ทำให้ประตูเกิดการสั่นสะเทือน
        </p>
      </div>

      <div class="everyday-item">
        <h4>เสียงพูด (Human Voice)</h4>
        <p>
          เกิดจากการสั่นสะเทือนของเส้นเสียง ขณะที่อากาศไหลผ่านกล่องเสียง
        </p>
      </div>

      <div class="everyday-item">
        <h4>เสียงกีตาร์ (Guitar Sound)</h4>
        <p>
          เกิดจากการสั่นสะเทือนของสายกีตาร์เมื่อถูกดีด และส่งผ่านแรงสั่นสะเทือนไปยังตัวกีตาร์เพื่อสร้างเสียง
        </p>
      </div>

    </article>


    <article class="fact-card">

      <div class="fact-label">✦ FUN FACT!</div>

      <h3>ทำไมเราถึงไม่ได้ยินเสียงในอวกาศ?</h3>

      <p>
        เพราะอวกาศส่วนใหญ่เป็นสุญญากาศ ซึ่งแทบไม่มีตัวกลางสำหรับส่งผ่านคลื่นเสียง
        ดังนั้นเสียงจึงไม่สามารถเดินทางผ่านอวกาศมาถึงหูของเราได้เหมือนเสียงที่เดินทางผ่านอากาศบนโลก
      </p>

    </article>

  `,


  /* =====================================

  frequency: `

    <div class="lesson-page-heading">
      <h1>Frequency</h1>
    </div>

    <article class="content-card">

      <h3>Frequency (ความถี่)</h3>

      <p>
        ความถี่ (Frequency) คือจำนวนรอบที่วัตถุเกิดการสั่นสะเทือนภายในเวลา 1 วินาที
        โดยมีหน่วยเป็นเฮิรตซ์ (Hertz: Hz)

      <p>
        ตัวอย่างเช่น หากวัตถุสั่นสะเทือน 100 รอบภายใน 1 วินาที

      <p>

      <h3>ช่วงความถี่ที่มนุษย์ได้ยิน</h3>

      </p>

      <p>

        โดยขึ้นอยู่กับปัจจัยต่าง ๆ เช่น อายุ สุขภาพของระบบการได้ยิน

      </p>

      <h3>Frequency กับช่วงอายุ</h3>

      <p>

        โดยตัวเลขต่อไปนี้เป็นช่วงความถี่โดยประมาณที่อาจพบได้
        ไม่ใช่เกณฑ์ตายตัวของทุกคน
      </p>

      <div class="frequency-table">

        <div class="frequency-row">
          <span>เด็ก-วัยรุ่น</span>
          <strong>18,000 - 20,000 Hz</strong>
        </div>

        <div class="frequency-row">
          <span>20-30 ปี</span>
          <strong>15,000 - 17,000 Hz</strong>
        </div>

        <div class="frequency-row">
          <span>40-50 ปี</span>
          <strong>12,000 - 14,000 Hz</strong>
        </div>

        <div class="frequency-row">
          <span>60 ปีขึ้นไป</span>
          <strong>8,000 - 10,000 Hz</strong>

/* =========================================

const fundamentalTitles = {
  sound: "What is Sound?",
  frequency: "Frequency",
  waveform: "Waveform"
};

async function saveRecentFundamentalLesson(topicKey) {
  const title = fundamentalTitles[topicKey];
  if (!title) return;

  const lessonPayload = {
    type: "lesson",
    lessonId: topicKey,
    lessonName: title,
    category: "Sound Fundamentals",
    url: `sound-fundamentals.html?topic=${encodeURIComponent(topicKey)}`,
    status: "in_progress",
    updatedAt: Date.now()
  };

  try {
    localStorage.setItem("bts_recent_lesson", JSON.stringify(lessonPayload));
  } catch (_) {}

  try {
    const { auth, db } = await import("./firebase-config.js");
    const { doc, setDoc, serverTimestamp } = await import(
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
    );
    if (auth.currentUser) {
      const ref = doc(db, "users", auth.currentUser.uid, "learningResults", `lesson_${topicKey}`);
      await setDoc(ref, {
        ...lessonPayload,
        updatedAt: serverTimestamp()
      }, { merge: true });
    }
  } catch (err) {
    console.warn("Could not sync recent lesson to Firestore:", err);
  }
}

if (selectedTopic && lessons[selectedTopic]) {

  topicPage.hidden = true;
  lessonPage.hidden = false;

  lessonContent.innerHTML = lessons[selectedTopic];

  document.title =
    selectedTopic.charAt(0).toUpperCase() +
    selectedTopic.slice(1) +
    " | Behind The Sound";

  saveRecentFundamentalLesson(selectedTopic);

} else {

  topicPage.hidden = false;
  lessonPage.hidden = true;

}


/* =========================================
   5. WAVEFORM AUDIO
========================================= */

let audioContext = null;
let currentOscillator = null;
let currentButton = null;

const SOUND_DURATION = 1.5;
const SOUND_FREQUENCY = 440;


/* =========================================
   6. STOP CURRENT AUDIO
========================================= */

function stopCurrentAudio() {

  if (currentOscillator) {

    try {
      currentOscillator.stop();
    } catch (error) {
      // Audio already stopped
    }

    currentOscillator = null;
  }

  if (currentButton) {
    currentButton.classList.remove("playing");
    currentButton = null;
  }

}


/* =========================================
   7. PLAY WAVEFORM
========================================= */

async function playWaveform(type, button) {

  stopCurrentAudio();

  if (!audioContext) {

    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) {
      alert("Your browser does not support audio playback.");
      return;
    }

    audioContext = new AudioContextClass();

  }

  if (audioContext.state === "suspended") {
    await audioContext.resume();
  }

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = type;
  oscillator.frequency.value = SOUND_FREQUENCY;

  const now = audioContext.currentTime;

  gain.gain.setValueAtTime(0.0001, now);

  gain.gain.exponentialRampToValueAtTime(
    0.08,
    now + 0.04
  );

  gain.gain.setValueAtTime(
    0.08,
    now + 1.2
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now + SOUND_DURATION
  );

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  currentOscillator = oscillator;
  currentButton = button;

  button.classList.add("playing");

  oscillator.start();
  oscillator.stop(now + SOUND_DURATION);

  oscillator.onended = () => {

    button.classList.remove("playing");

    if (currentOscillator === oscillator) {
      currentOscillator = null;
      currentButton = null;
    }

  };

}


/* =========================================
   8. WAVEFORM BUTTON EVENTS
========================================= */

document.querySelectorAll(".wave-type").forEach(button => {

  button.addEventListener("click", async () => {

    const type = button.dataset.wave;

    try {

      await playWaveform(type, button);

    } catch (error) {

      console.error("Audio playback error:", error);

    }

  });

});


/* =========================================
   9. CLEANUP
========================================= */

window.addEventListener("pagehide", () => {

  stopCurrentAudio();

  if (audioContext) {
    audioContext.close();
    audioContext = null;
  }

});
