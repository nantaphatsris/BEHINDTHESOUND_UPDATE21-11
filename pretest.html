<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pretest | Behind The Sound</title>

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       BEHIND THE SOUND
       PRETEST - DARK GOLD
    ========================================= */

    :root {
      --bg: #100e0c;
      --panel: #282720;
      --orange: #ffad59;
      --gold: #e8a04d;
      --text: #f4e7d9;
      --muted: #b9a99a;
      --border: rgba(232,160,77,.42);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;

      background-color: var(--bg);

      background-image:
        linear-gradient(
          rgba(16,14,12,.88),
          rgba(16,14,12,.94)
        ),
        repeating-linear-gradient(
          90deg,
          transparent 0px,
          transparent 39px,
          rgba(255,173,89,.09) 40px
        ),
        repeating-linear-gradient(
          0deg,
          transparent 0px,
          transparent 39px,
          rgba(255,173,89,.09) 40px
        );

      color: var(--text);
      font-family: 'Montserrat', 'Kanit', sans-serif;
    }


    /* =========================================
       HEADER
    ========================================= */

    .quiz-header {
      width: 100%;
      height: 76px;

      padding: 0 25px;

      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;

      background: rgba(20,17,14,.97);

      border-bottom: 1px solid var(--border);

      position: sticky;
      top: 0;
      z-index: 100;
    }

    .back-button {
      justify-self: start;

      width: 40px;
      height: 45px;

      border: none;
      background: transparent;

      color: var(--orange);

      font-family: Arial, sans-serif;
      font-size: 36px;
      font-weight: 300;

      cursor: pointer;
    }

    .back-button:hover {
      color: #ffd09c;
    }

    .header-title {
      color: var(--text);

      font-size: 18px;
      font-weight: 600;

      letter-spacing: .5px;
    }

    .header-space {
      width: 40px;
    }


    /* =========================================
       MAIN CONTAINER
    ========================================= */

    .quiz-container {
      width: 100%;
      max-width: 780px;

      margin: auto;

      padding: 45px 25px 30px;
    }


    /* =========================================
       TOP INFORMATION
    ========================================= */

    .quiz-top-info {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 15px;
    }

    .quiz-top-info span:first-child {
      color: var(--orange);

      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .quiz-top-info span:last-child {
      color: var(--muted);
      font-size: 12px;
    }


    /* =========================================
       QUESTION CARD
    ========================================= */

    .question-card {
      width: 100%;

      padding: 35px 30px 25px;

      background: rgba(40,39,32,.97);

      border: 1.5px solid var(--border);
      border-radius: 18px;

      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }

    .question-progress-text {
      color: #c5a47e;

      font-size: 17px;
      font-weight: 500;

      margin-bottom: 18px;
    }

    .question-text {
      color: #f7f0e8;

      font-size: 19px;
      font-weight: 500;

      line-height: 1.55;

      margin-bottom: 27px;

      white-space: pre-line;
    }


    /* =========================================
       MCQ ANSWER OPTIONS (Q1 - Q15)
    ========================================= */

    .answer-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .answer-option {
      width: 100%;
      min-height: 59px;

      padding: 10px 14px;

      display: flex;
      align-items: center;
      gap: 13px;

      background: rgba(255,255,255,.015);

      border: 1.5px solid rgba(198,171,132,.42);
      border-radius: 14px;

      color: #eee7dd;

      text-align: left;

      font-family: 'Kanit', sans-serif;
      font-size: 15px;

      cursor: pointer;

      transition: .2s;
    }

    .answer-option:hover {
      border-color: var(--orange);
      background: rgba(255,157,67,.07);
    }

    .answer-option.selected {
      background: rgba(255,157,67,.13);

      border-color: var(--orange);

      box-shadow: 0 0 12px rgba(255,157,67,.12);
    }

    .option-letter {
      min-width: 22px;

      color: #d8a76e;

      font-family: 'Montserrat', sans-serif;
      font-size: 21px;
      font-weight: 600;
    }

    .option-text {
      line-height: 1.45;
    }


    /* =========================================
       AUDIO LISTENING OPTIONS (Q16 - Q20)
       Layout เหมือน Posttest / สี Pretest Dark Gold
    ========================================= */

    .audio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }

    .audio-card {
      background: rgba(24, 21, 17, 0.92);
      border: 1.5px solid rgba(198, 171, 132, 0.35);
      border-radius: 14px;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .audio-card:hover {
      border-color: var(--orange);
      background: rgba(255, 173, 89, 0.06);
      transform: translateY(-2px);
    }

    .audio-card.selected {
      background: rgba(255, 173, 89, 0.14);
      border-color: var(--orange);
      box-shadow: 0 0 16px rgba(255, 173, 89, 0.18);
    }

    .audio-card-title {
      align-self: flex-start;
      font-family: 'Montserrat', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: #e8a04d;
      margin-bottom: 14px;
    }

    .waveform {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 44px;
      width: 100%;
      margin-bottom: 16px;
    }

    .wave-bar {
      width: 3px;
      background-color: #d9c8b4;
      border-radius: 2px;
      transition: background-color 0.2s;
    }

    .audio-card.selected .wave-bar,
    .audio-card.playing .wave-bar {
      background-color: var(--orange);
    }

    .audio-card.playing .wave-bar {
      animation: wavePulse 0.55s infinite alternate ease-in-out;
    }

    @keyframes wavePulse {
      from { transform: scaleY(0.6); }
      to { transform: scaleY(1.3); }
    }

    .audio-toggle-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 96px;
      padding: 7px 16px;
      border-radius: 999px;
      border: 1px solid var(--gold);
      background: rgba(255, 173, 89, 0.1);
      color: var(--orange);
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .audio-toggle-btn:hover {
      background: var(--orange);
      color: #1f140a;
    }

    .audio-toggle-btn.playing {
      background: #e88c3c;
      border-color: #ffad59;
      color: #1a1008;
    }

    .audio-select-row {
      text-align: center;
      margin-bottom: 14px;
    }

    .audio-select-label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .audio-radio-group {
      display: flex;
      justify-content: center;
      gap: 34px;
    }

    .audio-radio-btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .radio-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(232, 160, 77, 0.55);
      transition: 0.2s;
    }

    .audio-radio-btn.selected .radio-dot {
      border-color: var(--orange);
      background-color: var(--orange);
      box-shadow: 0 0 10px rgba(255, 173, 89, 0.55);
    }


    /* =========================================
       ANSWER HINT
    ========================================= */

    .answer-hint {
      min-height: 22px;

      margin-top: 13px;

      color: #a99b88;

      font-size: 11px;
      text-align: center;
    }


    /* =========================================
       TIMER
    ========================================= */

    .timer-section {
      margin-top: 12px;
    }

    .timer-text {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 9px;

      color: #c6ad8d;
      font-size: 12px;
    }

    .timer-text strong {
      color: var(--orange);
      font-size: 16px;
    }

    .timer-track {
      width: 100%;
      height: 7px;

      background: #49463e;

      border-radius: 20px;
      overflow: hidden;
    }

    .timer-fill {
      width: 100%;
      height: 100%;

      background: linear-gradient(
        90deg,
        #ffc078,
        #e58c3c
      );

      border-radius: 20px;

      transition: width 1s linear;
    }


    /* =========================================
       NAVIGATION
    ========================================= */

    .quiz-navigation {
      display: flex;
      justify-content: space-between;
      gap: 15px;

      margin-top: 55px;
    }

    .previous-button,
    .next-button {
      min-width: 145px;

      padding: 13px 25px;

      border-radius: 15px;

      font-family: 'Kanit', sans-serif;
      font-size: 15px;

      cursor: pointer;
      transition: .25s;
    }

    .previous-button {
      background: transparent;

      border: 1px solid var(--border);

      color: #c8ad8b;
    }

    .previous-button:hover:not(:disabled) {
      background: rgba(255,157,67,.08);
      border-color: var(--orange);
    }

    .previous-button:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .next-button {
      background: linear-gradient(
        135deg,
        #ffc078,
        #e98e3c
      );

      border: 1px solid #ffbd70;

      color: #24170d;
      font-weight: 500;

      box-shadow: 0 0 15px rgba(255,157,67,.15);
    }

    .next-button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .next-button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .next-button.submit-button {
      background: linear-gradient(
        135deg,
        #ffd28f,
        #ff9d43
      );
    }


    /* =========================================
       BOTTOM PROGRESS
    ========================================= */

    .bottom-progress {
      display: flex;
      justify-content: space-between;

      margin-top: 28px;

      color: #867767;

      font-size: 10px;
      letter-spacing: .5px;
    }

    .save-status {
      margin-top: 12px;
      color: var(--orange);
      text-align: center;
      font-size: 12px;
    }


    /* =========================================
       RESULT MODAL
    ========================================= */

    .result-overlay {
      position: fixed;
      inset: 0;

      display: none;
      justify-content: center;
      align-items: center;

      padding: 20px;

      background: rgba(0,0,0,.85);

      z-index: 500;
    }

    .result-overlay.active {
      display: flex;
    }

    .result-card {
      width: 100%;
      max-width: 390px;

      padding: 35px 25px;

      text-align: center;

      background: #211d17;

      border: 1px solid var(--border);
      border-radius: 20px;
    }

    .result-icon {
      width: 65px;
      height: 65px;

      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid var(--orange);
      border-radius: 50%;

      color: var(--orange);
      font-size: 30px;
    }

    .result-label {
      color: var(--orange);

      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .result-card h2 {
      margin-top: 12px;
      font-size: 24px;
    }

    .result-score {
      margin: 25px 0;
      color: var(--orange);
    }

    .result-score strong {
      font-size: 55px;
      font-weight: 800;
    }

    .result-score span {
      color: var(--muted);
      font-size: 22px;
    }

    .result-message {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .result-home-button {
      width: 100%;

      margin-top: 25px;
      padding: 13px;

      border: none;
      border-radius: 25px;

      background: linear-gradient(
        135deg,
        #ffc078,
        #e98e3c
      );

      color: #24170d;

      font-family: 'Kanit', sans-serif;
      font-size: 15px;

      cursor: pointer;
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 650px) {
      .audio-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {

      .quiz-header {
        height: 62px;
        padding: 0 16px;
      }

      .header-title {
        font-size: 16px;
      }

      .quiz-container {
        padding: 35px 18px 25px;
      }

      .question-card {
        padding: 30px 16px 23px;
        border-radius: 16px;
      }

      .question-progress-text {
        font-size: 16px;
      }

      .question-text {
        font-size: 18px;
      }

      .answer-option {
        min-height: 58px;
        padding: 10px 12px;
        font-size: 14px;
      }

      .quiz-navigation {
        margin-top: 45px;
        gap: 12px;
      }

      .previous-button,
      .next-button {
        min-width: 0;
        flex: 1;
        padding: 12px 10px;
        font-size: 14px;
      }

      .bottom-progress {
        font-size: 9px;
      }

    }

    @media (max-width: 360px) {

      .quiz-container {
        padding-left: 12px;
        padding-right: 12px;
      }

      .question-card {
        padding: 24px 13px 20px;
      }

      .question-text {
        font-size: 16px;
      }

      .answer-option {
        font-size: 13px;
      }

    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header class="quiz-header">

    <button
      class="back-button"
      id="backButton"
      type="button"
      aria-label="Back to Home">
      ‹
    </button>

    <div class="header-title">
      PRETEST
    </div>

    <div class="header-space"></div>

  </header>


  <!-- MAIN QUIZ -->

  <main class="quiz-container">

    <div class="quiz-top-info">
      <span>PRETEST</span>
      <span id="questionNumber">Question 1 of 20</span>
    </div>


    <!-- QUESTION CARD -->

    <section class="question-card">

      <div class="question-progress-text" id="questionLabel">
        Question 1 of 20
      </div>

      <h2 class="question-text" id="questionText">
        Loading question...
      </h2>


      <!-- ANSWERS (MCQ หรือ AUDIO) -->

      <div id="dynamicAnswerArea"></div>


      <p class="answer-hint" id="answerHint">
        Select one answer to continue.
      </p>


      <!-- TIMER -->

      <div class="timer-section">

        <div class="timer-text">
          <span>Time Remaining</span>
          <strong id="timer">15:00</strong>
        </div>

        <div class="timer-track">
          <div class="timer-fill" id="timerFill"></div>
        </div>

      </div>

    </section>


    <!-- NAVIGATION -->

    <div class="quiz-navigation">

      <button
        type="button"
        class="previous-button"
        id="previousButton"
        disabled>
        Previous
      </button>

      <button
        type="button"
        class="next-button"
        id="nextButton"
        disabled>
        Next
      </button>

    </div>


    <!-- BOTTOM INFO -->

    <div class="bottom-progress">

      <span id="answeredCount">0 / 20 Answered</span>

      <span>BEHIND THE SOUND</span>

    </div>

    <p class="save-status" id="saveStatus" role="status"></p>

  </main>


  <!-- RESULT POPUP -->

  <div class="result-overlay" id="resultOverlay">

    <div class="result-card">

      <div class="result-icon">✓</div>

      <p class="result-label">PRETEST COMPLETED</p>

      <h2>Your Result</h2>

      <div class="result-score">
        <strong id="finalScore">0</strong>
        <span>/ 20</span>
      </div>

      <p class="result-message" id="resultMessage">
        Your answers have been submitted.
      </p>

      <button
        type="button"
        id="homeButton"
        class="result-home-button">
        Back to Home →
      </button>

    </div>

  </div>


  <!-- JAVASCRIPT -->

  <script type="module">
    /* =========================================
       BEHIND THE SOUND
       PRETEST SYSTEM
       20 QUESTIONS / 15 MINUTES
    ========================================= */


    // =========================================
    // 1. SETTINGS
    // =========================================

    const TOTAL_QUESTIONS = 20;
    const TOTAL_TIME = 15 * 60;

    let currentQuestion = 0;
    let remainingTime = TOTAL_TIME;

    let currentUser = null;
    let db = null;

    let timerInterval = null;

    let isSubmitted = false;
    let isSaving = false;

    let userAnswers = Array(TOTAL_QUESTIONS).fill(null);

    // ระบบควบคุมเสียงสำหรับข้อ 16 - 20
    let currentAudio = null;
    let playingOptionIndex = null;
    let preloadedAudios = [];

    const waveHeights = [14, 24, 12, 34, 42, 26, 18, 38, 44, 28, 16, 40, 30, 20, 42, 26, 15, 35, 22, 14];


    // =========================================
    // 2. QUESTIONS (15 MCQ + 5 LISTENING)
    // =========================================

    const questions = [

      // --- ข้อ 1 - 15: เลือกตอบ ---
      {
        type: "mcq",
        question: "เสียงที่เราได้ยินในชีวิตประจำวันเกิดจากอะไร?",
        options: [
          "การสั่นสะเทือนของวัตถุ",
          "การเปลี่ยนแปลงของแสง",
          "การเคลื่อนที่ของอากาศอย่างเดียว",
          "การเปลี่ยนแปลงของอุณหภูมิ"
        ],
        answer: 0
      },

      {
        type: "mcq",
        question: "ข้อใดเป็นตัวอย่างของเสียงที่เกิดจากการสั่นสะเทือน?",
        options: [
          "แสงไฟเปิดขึ้น",
          "การดีดสายกีตาร์",
          "การมองเห็นภาพ",
          "การเปิดหน้าจอคอมพิวเตอร์"
        ],
        answer: 1
      },

      {
        type: "mcq",
        question: "เสียงสามารถเดินทางผ่านสิ่งใดได้บ้าง?",
        options: [
          "อากาศเท่านั้น",
          "น้ำเท่านั้น",
          "ของแข็งเท่านั้น",
          "อากาศ น้ำ และของแข็ง"
        ],
        answer: 3
      },

      {
        type: "mcq",
        question: "ถ้าเราอยู่ในอวกาศที่ไม่มีอากาศ เราจะได้ยินเสียงตามปกติหรือไม่?",
        options: [
          "ได้ยินเสียงชัดขึ้น",
          "ได้ยินเฉพาะเสียงดัง",
          "ไม่ได้ยินเสียง เพราะไม่มีตัวกลาง",
          "ได้ยินเสียงเบากว่าปกติ"
        ],
        answer: 2
      },

      {
        type: "mcq",
        question: "เสียงที่มีความถี่สูงจะมีลักษณะอย่างไร?",
        options: [
          "เสียงทุ้ม",
          "เสียงแหลม",
          "เสียงเบา",
          "เสียงก้อง"
        ],
        answer: 1
      },

      {
        type: "mcq",
        question: "หากต้องการให้เสียงมีความนุ่มนวลและลดเสียงแหลมลง ควรใช้เครื่องมือใด?",
        options: [
          "Low-Pass Filter",
          "High-Pass Filter",
          "Delay",
          "Pitch Shifter"
        ],
        answer: 0
      },

      {
        type: "mcq",
        question: "หากในเสียงพูดมีเสียงลมหรือเสียงทุ้มที่ไม่ต้องการ ควรใช้เครื่องมือใดช่วยลดเสียงเหล่านี้?",
        options: [
          "Reverb",
          "High-Pass Filter",
          "Low-Pass Filter",
          "Compressor"
        ],
        answer: 1
      },

      {
        type: "mcq",
        question: "EQ เป็นเครื่องมือที่ช่วยในเรื่องใด?",
        options: [
          "เปลี่ยนภาพให้เป็นเสียง",
          "เพิ่มความเร็วของเพลง",
          "ปรับเพิ่มหรือลดความถี่ของเสียง",
          "ทำให้เสียงเล่นซ้ำ"
        ],
        answer: 2
      },

      {
        type: "mcq",
        question: "ถ้าเสียงพูดมีบางช่วงดังมาก บางช่วงเบามาก ควรใช้เครื่องมือใดช่วยปรับเสียงให้สม่ำเสมอ?",
        options: [
          "Compressor",
          "Reverb",
          "Delay",
          "Pitch Shifter"
        ],
        answer: 0
      },

      {
        type: "mcq",
        question: "Reverb เป็นเอฟเฟกต์ที่ทำให้เสียงมีลักษณะอย่างไร?",

    // =========================================
    // 3. HTML ELEMENTS
    // =========================================

    const questionNumber = document.getElementById("questionNumber");
    const questionLabel = document.getElementById("questionLabel");

    const questionText = document.getElementById("questionText");
    const dynamicAnswerArea = document.getElementById("dynamicAnswerArea");

    const answerHint = document.getElementById("answerHint");

    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");

    const answeredCount = document.getElementById("answeredCount");

    const timerElement = document.getElementById("timer");
    const timerFill = document.getElementById("timerFill");

    const backButton = document.getElementById("backButton");

    const resultOverlay = document.getElementById("resultOverlay");
    const finalScore = document.getElementById("finalScore");
    const resultMessage = document.getElementById("resultMessage");

    const homeButton = document.getElementById("homeButton");
    const saveStatus = document.getElementById("saveStatus");


    // =========================================
    // 4. AUDIO PLAYBACK & PRELOAD HELPERS
    // =========================================

    function preloadAudioForQuestion(q) {
      preloadedAudios.forEach((a) => {
        a.pause();
        a.src = "";
      });
      preloadedAudios = [];

      if (!q || q.type !== "audio" || !Array.isArray(q.audioFiles)) return;

      preloadedAudios = q.audioFiles.map((src) => {
        const audio = new Audio();
        audio.preload = "auto";
        audio.loop = false;
        audio.src = src;
        audio.load();
        return audio;
      });
    }

    function stopAudioPlayback() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio.onended = null;
        currentAudio = null;
      }
      playingOptionIndex = null;
      syncAudioButtonsUI();
    }

    function syncAudioButtonsUI() {
      document.querySelectorAll(".audio-card").forEach((card, idx) => {
        card.classList.toggle("playing", playingOptionIndex === idx);
      });
      document.querySelectorAll(".audio-toggle-btn").forEach((btn, idx) => {
        const isPlaying = playingOptionIndex === idx;
        btn.classList.toggle("playing", isPlaying);
        btn.innerHTML = isPlaying ? "■ Stop" : "▶ Play";
      });
    }

    function toggleAudioOption(optIndex) {
      const q = questions[currentQuestion];
      if (!q || q.type !== "audio") return;

      if (playingOptionIndex === optIndex && currentAudio) {
        stopAudioPlayback();
        return;
      }

      stopAudioPlayback();

      const audio = preloadedAudios[optIndex] || new Audio(q.audioFiles[optIndex]);
      audio.pause();
      audio.currentTime = 0;
      audio.loop = false;

      currentAudio = audio;
      playingOptionIndex = optIndex;
      syncAudioButtonsUI();

      audio.onended = () => {
        if (currentAudio === audio) {
          currentAudio = null;
          playingOptionIndex = null;
          syncAudioButtonsUI();
        }
      };

      audio.onerror = () => {
        if (currentAudio === audio) {
          currentAudio = null;
          playingOptionIndex = null;
          syncAudioButtonsUI();
        }
      };

      audio.play().catch(() => {
        if (currentAudio === audio) {
          currentAudio = null;
          playingOptionIndex = null;
          syncAudioButtonsUI();
        }
      });
    }


    // =========================================
    // 5. RENDER QUESTION
    // =========================================

    function renderQuestion() {

      stopAudioPlayback();

      const question = questions[currentQuestion];
      const number = currentQuestion + 1;
      const selected = userAnswers[currentQuestion];

      questionNumber.textContent =
        `Question ${number} of ${TOTAL_QUESTIONS}`;

      questionLabel.textContent =
        `Question ${number} of ${TOTAL_QUESTIONS}`;

      questionText.textContent = question.question;

      dynamicAnswerArea.innerHTML = "";

      if (question.type === "mcq") {

        const answerList = document.createElement("div");
        answerList.className = "answer-list";

        const letters = ["ก", "ข", "ค", "ง"];

        question.options.forEach((option, index) => {

          const button = document.createElement("button");

          button.type = "button";
          button.className = "answer-option";

          const letter = document.createElement("span");

          letter.className = "option-letter";
          letter.textContent = letters[index];

          const text = document.createElement("span");

          text.className = "option-text";
          text.textContent = option;

          button.appendChild(letter);
          button.appendChild(text);

          if (selected === index) {
            button.classList.add("selected");
          }

          button.addEventListener("click", () => {
            selectAnswer(index);
          });

          answerList.appendChild(button);

        });

        dynamicAnswerArea.appendChild(answerList);

      } else {

        const letters = ["A", "B", "C"];
        const grid = document.createElement("div");
        grid.className = "audio-grid";

        letters.forEach((letter, idx) => {
          const card = document.createElement("div");
          card.className = "audio-card" + (selected === idx ? " selected" : "");
          card.addEventListener("click", () => selectAnswer(idx));

          const title = document.createElement("div");
          title.className = "audio-card-title";
          title.textContent = letter;

          const wave = document.createElement("div");
          wave.className = "waveform";
          waveHeights.forEach((h) => {
            const bar = document.createElement("span");
            bar.className = "wave-bar";
            bar.style.height = `${h}px`;
            wave.appendChild(bar);
          });

          const toggleBtn = document.createElement("button");
          toggleBtn.type = "button";
          toggleBtn.className = "audio-toggle-btn";
          toggleBtn.innerHTML = "▶ Play";
          toggleBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            toggleAudioOption(idx);
          });

          card.appendChild(title);
          card.appendChild(wave);
          card.appendChild(toggleBtn);
          grid.appendChild(card);
        });

        const radioSection = document.createElement("div");
        radioSection.className = "audio-select-row";

        const radioLabel = document.createElement("div");
        radioLabel.className = "audio-select-label";
        radioLabel.textContent = "Select one answer";

        const radioGroup = document.createElement("div");
        radioGroup.className = "audio-radio-group";

        letters.forEach((letter, idx) => {
          const radioBtn = document.createElement("div");
          radioBtn.className = "audio-radio-btn" + (selected === idx ? " selected" : "");
          radioBtn.addEventListener("click", () => selectAnswer(idx));

          const dot = document.createElement("span");
          dot.className = "radio-dot";

          const txt = document.createElement("span");
          txt.textContent = letter;

          radioBtn.appendChild(dot);
          radioBtn.appendChild(txt);
          radioGroup.appendChild(radioBtn);
        });

        radioSection.appendChild(radioLabel);
        radioSection.appendChild(radioGroup);

        dynamicAnswerArea.appendChild(grid);
        dynamicAnswerArea.appendChild(radioSection);

      }


      previousButton.disabled = currentQuestion === 0;

      if (currentQuestion === TOTAL_QUESTIONS - 1) {

        nextButton.textContent = "Submit";
        nextButton.classList.add("submit-button");

      } else {

        nextButton.textContent = "Next";
        nextButton.classList.remove("submit-button");

      }

      nextButton.disabled = selected === null;

      answerHint.textContent =
        selected === null
          ? "Select one answer to continue."
          : "Answer selected.";

      updateAnsweredCount();
      preloadAudioForQuestion(question);

    }


    // =========================================
    // 6. SELECT ANSWER
    // =========================================

    function selectAnswer(index) {

      if (isSubmitted || isSaving) return;

      userAnswers[currentQuestion] = index;

      if (questions[currentQuestion].type === "mcq") {
        document.querySelectorAll(".answer-option").forEach((el, idx) => {
          el.classList.toggle("selected", idx === index);
        });
      } else {
        document.querySelectorAll(".audio-card").forEach((el, idx) => {
          el.classList.toggle("selected", idx === index);
        });
        document.querySelectorAll(".audio-radio-btn").forEach((el, idx) => {
          el.classList.toggle("selected", idx === index);
        });
      }

      nextButton.disabled = false;
      answerHint.textContent = "Answer selected.";
      updateAnsweredCount();

    }


    // =========================================
    // 7. ANSWER COUNTER
    // =========================================

    function updateAnsweredCount() {

      const count = userAnswers.filter(
        answer => answer !== null
      ).length;

      answeredCount.textContent =
        `${count} / ${TOTAL_QUESTIONS} Answered`;

    }


    // =========================================
    // 8. NEXT / SUBMIT
    // =========================================

    nextButton.addEventListener("click", () => {

      if (isSubmitted || isSaving) return;

      if (userAnswers[currentQuestion] === null) return;

      if (currentQuestion === TOTAL_QUESTIONS - 1) {

        submitQuiz(false);
        return;

      }

      currentQuestion++;

      renderQuestion();

    });


    // =========================================
    // 9. PREVIOUS
    // =========================================

    previousButton.addEventListener("click", () => {

      if (isSubmitted || isSaving) return;

      if (currentQuestion <= 0) return;

      currentQuestion--;

      renderQuestion();

    });


    // =========================================
    // 10. BACK TO HOME
    // =========================================

    function goHome() {

      stopAudioPlayback();
      window.location.assign("./home.html");

    }

    backButton.addEventListener("click", goHome);

    homeButton.addEventListener("click", goHome);


    // =========================================
    // 11. TIMER
    // =========================================

    function startTimer() {

      if (timerInterval) return;

      timerInterval = setInterval(() => {

        if (isSubmitted || isSaving) return;

        remainingTime--;

        updateTimerDisplay();

        if (remainingTime <= 0) {

          clearInterval(timerInterval);
          timerInterval = null;

          submitQuiz(true);

        }

      }, 1000);

    }


    // =========================================
    // 12. TIMER DISPLAY
    // =========================================

    function updateTimerDisplay() {

      const minutes = Math.floor(remainingTime / 60);
      const seconds = remainingTime % 60;

      timerElement.textContent =
        `${String(minutes).padStart(2, "0")}:` +
        `${String(seconds).padStart(2, "0")}`;

      const percentage =
        (remainingTime / TOTAL_TIME) * 100;

      timerFill.style.width = `${percentage}%`;

      if (remainingTime <= 60) {

        timerElement.style.color = "#ff7770";
        timerFill.style.background = "#ff7770";

      }

    }


    // =========================================
    // 13. CALCULATE SCORE
    // =========================================

    function calculateScore() {

      let score = 0;

      questions.forEach((question, index) => {

        if (userAnswers[index] === question.answer) {
          score++;
        }

      });

      return score;

    }


    // =========================================
    // 14. FIREBASE CONNECTION
    // =========================================

    async function initializeFirebase() {

      try {

        const configModule = await import("./firebase-config.js");

        const { firebaseConfig } = configModule;

        const appModule = await import(
          "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"
        );

        const authModule = await import(
          "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"
        );

        const firestoreModule = await import(
          "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
        );

        const app = appModule.getApps().length
          ? appModule.getApp()
          : appModule.initializeApp(firebaseConfig);

        const auth = authModule.getAuth(app);

        db = firestoreModule.getFirestore(app);

        await new Promise((resolve) => {

          authModule.onAuthStateChanged(
            auth,

            (user) => {
              currentUser = user;
              resolve();
            },

            (error) => {
              console.error("Auth error:", error);
              resolve();
            }
          );

        });

        console.log("Firebase connected successfully");

      } catch (error) {

        console.error("Firebase connection error:", error);

        saveStatus.textContent =
          "Firebase connection error. Quiz can still be completed, but results may not be saved.";

      }

    }


    // =========================================
    // 15. SUBMIT QUIZ
    // =========================================

    async function submitQuiz(timeUp = false) {

      if (isSubmitted || isSaving) return;

      if (!timeUp) {

        const allAnswered = userAnswers.every(
          answer => answer !== null
        );

        if (!allAnswered) {

          answerHint.textContent =
            "Please answer all questions before submitting.";

          return;

        }

      }

      stopAudioPlayback();

      isSaving = true;

      nextButton.disabled = true;
      previousButton.disabled = true;

      clearInterval(timerInterval);
      timerInterval = null;

      const score = calculateScore();

      saveStatus.textContent = "Saving your result...";

      try {

        await firebaseReady;

        if (!currentUser || !db) {

          throw new Error("User is not authenticated.");

        }

        await firestoreAddResult(score, timeUp);

        isSubmitted = true;

        saveStatus.textContent = "";

        showResult(score, timeUp, true);

      } catch (error) {

        console.error("Pretest save error:", error);

        isSubmitted = true;

        saveStatus.textContent = "";

        showResult(score, timeUp, false);

      }

    }


    // =========================================
    // 16. FIRESTORE SAVE
    // =========================================

    async function firestoreAddResult(score, timeUp) {

      const firestoreModule = await import(
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
      );

      await firestoreModule.addDoc(

        firestoreModule.collection(
          db,
          "users",
          currentUser.uid,
          "learningResults"
        ),

        {

          type: "pretest",

          score: score,

          maxScore: TOTAL_QUESTIONS,

          completed: true,

          answers: userAnswers,

          timeUsed: TOTAL_TIME - remainingTime,

          timeUp: timeUp,

          createdAt: firestoreModule.serverTimestamp()

        }

      );

    }


    // =========================================
    // 17. SHOW RESULT
    // =========================================

    function showResult(score, timeUp, saved) {

      finalScore.textContent = score;

      if (saved) {

        resultMessage.textContent = timeUp
          ? "Time is up! Your result has been saved."
          : "Your pretest result has been saved successfully.";

      } else {

        resultMessage.textContent =
          "Your score has been calculated, but the result could not be saved to Firebase. Please check your login and connection.";

      }

      resultOverlay.classList.add("active");

    }


    // =========================================
    // 18. START SYSTEM
    // =========================================

    renderQuestion();

    updateTimerDisplay();

    startTimer();

    const firebaseReady = initializeFirebase();


    // =========================================
    // END
    // =========================================
  </script>
