<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Posttest - Behind The Sound</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090807;
      --header-bg: #110e0b;
      --accent-orange: #f27427;
      --accent-orange-hover: #ff853b;
      --accent-gold: #e5a95c;
      --text-main: #ffffff;
      --text-muted: #b8a89a;
      --card-gradient: linear-gradient(115deg, #0c0a09 0%, #1c120c 42%, #6e371b 82%, #9a512a 100%);
      --border-subtle: rgba(242, 116, 39, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Header (เหมือนหน้า Pretest รูปที่ 3) */
    .top-bar {
      height: 58px;
      background-color: var(--header-bg);
      border-bottom: 1px solid rgba(229, 169, 92, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 0 24px;
    }

    .back-btn {
      position: absolute;
      left: 24px;
      background: none;
      border: none;
      color: var(--accent-gold);
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .back-btn:hover {
      background: rgba(242, 116, 39, 0.15);
    }

    .top-bar-title {
      color: var(--accent-gold);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Main Container */
    .container {
      flex: 1;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 36px 20px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Meta Header above card */
    .quiz-meta-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 12px;
      letter-spacing: 0.8px;
    }

    .quiz-badge {
      color: var(--accent-orange);
      font-weight: 700;
      text-transform: uppercase;
    }

    .quiz-progress-text {
      color: var(--text-muted);
    }

    /* Main Quiz Card (สี Gradient ส้มอิฐ-ดำ เหมือนรูปที่ 2) */
    .quiz-card {
      background: var(--card-gradient);
      border: 1px solid rgba(242, 116, 39, 0.45);
      border-radius: 20px;
      padding: 32px 34px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      transition: all 0.3s ease;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .question-step {
      color: var(--accent-orange);
      font-size: 14px;
      font-weight: 500;
    }

    .question-type-tag {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(242, 116, 39, 0.4);
      color: #ffd3b6;
    }

    .question-title {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .question-subtitle {
      font-size: 13px;
      color: #d6c3b5;
      margin-bottom: 24px;
    }

    /* Standard 4 Choices (ข้อ 1 - 10) */
    .choices-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 26px;
    }

    .choice-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 15px 20px;
      background: rgba(12, 10, 9, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .choice-item:hover {
      border-color: rgba(242, 116, 39, 0.65);
      background: rgba(32, 19, 12, 0.85);
    }

    .choice-item.selected {
      background: linear-gradient(90deg, rgba(242, 116, 39, 0.28) 0%, rgba(168, 74, 24, 0.42) 100%);
      border-color: var(--accent-orange);
      box-shadow: 0 0 0 1px var(--accent-orange);
    }

    .choice-prefix {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--accent-orange);
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .choice-item.selected .choice-prefix {
      background: var(--accent-orange);
      color: #120904;
    }

    .choice-text {
      font-size: 15px;
      color: #f5ede6;
    }

    /* Audio Comparison Choices (ข้อ 11 - 15 เหมือนรูปที่ 2) */
    .audio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .audio-card {
      background: #0c0a09;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .audio-card:hover {
      border-color: rgba(242, 116, 39, 0.7);
      transform: translateY(-2px);
    }

    .audio-card.selected {
      background: linear-gradient(180deg, rgba(168, 86, 38, 0.55) 0%, rgba(92, 46, 20, 0.7) 100%);
      border-color: var(--accent-orange);
      box-shadow: 0 0 20px rgba(242, 116, 39, 0.25);
    }

    .audio-card-label {
      align-self: flex-start;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #ffffff;
    }

    /* Waveform Bars */
    .waveform {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 46px;
      margin-bottom: 18px;
      width: 100%;
    }

    .wave-bar {
      width: 3px;
      background-color: #ffffff;
      border-radius: 2px;
      transition: background-color 0.2s, transform 0.15s;
    }

    .audio-card.selected .wave-bar,
    .audio-card.playing .wave-bar {
      background-color: var(--accent-orange);
    }

    .audio-card.playing .wave-bar {
      animation: pulseWave 0.6s infinite alternate ease-in-out;
    }

    @keyframes pulseWave {
      from { transform: scaleY(0.65); }
      to { transform: scaleY(1.25); }
    }

    .play-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(242, 116, 39, 0.12);
      border: 1px solid rgba(242, 116, 39, 0.45);
      color: var(--accent-orange);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .play-btn:hover {
      background: var(--accent-orange);
      color: #120904;
    }

    .play-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1.5px solid currentColor;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
    }

    /* Radio Selector row for Audio questions */
    .audio-radio-section {
      text-align: center;
      margin-bottom: 24px;
    }

    .audio-radio-hint {
      font-size: 14px;
      color: #f0dfd3;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .audio-radio-group {
      display: flex;
      justify-content: center;
      gap: 36px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 18px;
      font-weight: 600;
    }

    .radio-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.45);
      display: inline-block;
      position: relative;
      transition: all 0.2s;
    }

    .radio-option.selected .radio-circle {
      border-color: var(--accent-orange);
      background-color: var(--accent-orange);
      box-shadow: 0 0 10px rgba(242, 116, 39, 0.6);
    }

    /* Timer Section inside Card (เหมือน Pretest รูปที่ 3) */
    .card-footer-hint {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .timer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .timer-label {
      color: var(--text-muted);
    }

    .timer-value {
      color: var(--accent-orange);
      font-weight: 600;
      font-size: 14px;
    }

    .timer-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 999px;
      overflow: hidden;
    }

    .timer-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #d95d1e 0%, #ff8c42 100%);
      border-radius: 999px;
      transition: width 1s linear;
    }

    /* Navigation Buttons below Card */
    .nav-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 22px;
    }

    .btn-prev {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-muted);
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-prev:hover:not(:disabled) {
      border-color: var(--accent-orange);
      color: #fff;
    }

    .btn-prev:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-next {
      background: var(--accent-orange);
      border: none;
      color: #140903;
      font-weight: 600;
      padding: 12px 34px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-next:hover:not(:disabled) {
      background: var(--accent-orange-hover);
      transform: translateY(-1px);
    }

    .btn-next:disabled {
      background: rgba(242, 116, 39, 0.3);
      color: rgba(255, 255, 255, 0.45);
      cursor: not-allowed;
    }

    .bottom-status {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
      font-size: 11px;
      color: #6e6259;
      letter-spacing: 0.5px;
    }

    /* Result Screen */
    .result-box {
      text-align: center;
      padding: 20px 10px;
    }

    .result-score {
      font-size: 48px;
      font-weight: 700;
      color: var(--accent-orange);
      margin: 16px 0;
    }

    @media (max-width: 680px) {
      .audio-grid {
        grid-template-columns: 1fr;
      }
      .quiz-card {
        padding: 24px 18px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Bar เหมือน Pretest -->
  <header class="top-bar">
    <button class="back-btn" onclick="window.location.href='home.html'" title="กลับหน้าหลัก">&#8249;</button>
    <div class="top-bar-title">POSTTEST</div>
  </header>

  <main class="container">
    <div class="quiz-meta-top">
      <span class="quiz-badge">POSTTEST</span>
      <span class="quiz-progress-text" id="topProgressText">Question 1 of 15</span>
    </div>

    <div class="quiz-card" id="quizCard">
      <!-- Content injected by JS -->
    </div>

    <div class="nav-actions" id="navActions">
      <button class="btn-prev" id="prevBtn" onclick="prevQuestion()">Previous</button>
      <button class="btn-next" id="nextBtn" onclick="nextQuestion()" disabled>Next</button>
    </div>

    <div class="bottom-status" id="bottomStatus">
      <span id="answeredCounter">0 / 15 Answered</span>
      <span>BEHIND THE SOUND</span>
    </div>
  </main>

  <script>
    // ข้อมูลข้อสอบ 15 ข้อ (10 ข้อเลือกตอบ + 5 ข้อฟังเสียง)
    // คุณสามารถแก้ไขคำถาม ตัวเลือก และเฉลย (answer) ใน Array นี้ได้เลย
    const questions = [
      // --- ส่วนที่ 1: เลือกตอบ 10 ข้อ ---
      {
        type: 'mcq',
        question: 'เสียงที่เราได้ยินในชีวิตประจำวันเกิดจากอะไร?',
        choices: ['การสั่นสะเทือนของวัตถุ', 'การเปลี่ยนแปลงของแสง', 'การเคลื่อนที่ของอากาศอย่างเดียว', 'การเปลี่ยนแปลงของอุณหภูมิ'],
        answer: 0
      },
      {
        type: 'mcq',
        question: 'คุณสมบัติใดของคลื่นเสียงที่กำหนดระดับเสียงสูง-ต่ำ (Pitch)?',
        choices: ['แอมพลิจูด (Amplitude)', 'ความถี่ (Frequency)', 'เฟส (Phase)', 'ความเร็วเสียง (Velocity)'],
        answer: 1
      },
      {
        type: 'mcq',
        question: 'หน่วยวัดความดังของเสียงที่นิยมใช้ในงานด้านระบบเสียงคือข้อใด?',
        choices: ['Hertz (Hz)', 'Decibel (dB)', 'Ohm (Ω)', 'Millisecond (ms)'],
        answer: 1
      },
      {
        type: 'mcq',
        question: 'ช่วงความถี่เสียงที่หูของมนุษย์ปกติสามารถได้ยินอยู่ในช่วงใด?',
        choices: ['2 Hz – 2,000 Hz', '20 Hz – 20,000 Hz', '200 Hz – 200,000 Hz', '10 Hz – 10,000 Hz'],
        answer: 1
      },
      {
        type: 'mcq',
        question: 'เอฟเฟกต์ Reverb มีหน้าที่จำลองลักษณะทางเสียงแบบใด?',
        choices: ['การเปลี่ยนระดับเสียงให้สูงขึ้น', 'เสียงสะท้อนก้องภายในพื้นที่หรือห้อง', 'การตัดย่านความถี่ต่ำทิ้งทั้งหมด', 'การบีบอัดไดนามิกของเสียง'],
        answer: 1
      },
      {
        type: 'mcq',
        question: 'พารามิเตอร์ Feedback ในเอฟเฟกต์ Delay ควบคุมสิ่งใด?',
        choices: ['ความสว่างของโทนเสียง', 'จำนวนครั้งหรือความต่อเนื่องของเสียงสะท้อนซ้ำ', 'ความกว้างของมิติสเตอริโอ', 'ความเร็วในการโจมตีของเสียง (Attack)'],
        answer: 1
      },
      {
        type: 'mcq',
        question: 'การปรับ Pitch Shift เป็นค่า +12 Semitones จะส่งผลต่อเสียงอย่างไร?',
        choices: ['เสียงต่ำลง 1 Octave', 'เสียงสูงขึ้น 1 Octave', 'เสียงดังขึ้น 12 dB', 'เสียงช้าลงครึ่งหนึ่ง'],
        answer: 1
      },
      {
        type: 'mcq',
        question: 'ข้อใดคือความแตกต่างหลักระหว่าง Dry Signal และ Wet Signal?',
        choices: [
          'Dry คือเสียงต้นฉบับที่ยังไม่ผ่านเอฟเฟกต์, Wet คือเสียงที่ผ่านการประมวลผลแล้ว',
          'Dry คือเสียงความถี่สูง, Wet คือเสียงความถี่ต่ำ',
          'Dry คือเสียงโมโน, Wet คือเสียงสเตอริโอ',
          'Dry คือเสียงที่บันทึกในห้องอัด, Wet คือเสียงสังเคราะห์'
        ],
        answer: 0
      },
      {
        type: 'mcq',
        question: 'หากต้องการลดเสียงรบกวนความถี่ต่ำมาก (เช่น เสียงลมหรือเสียงหึ่ง) ควรเลือกใช้ฟิลเตอร์ชนิดใด?',
        choices: ['Low-Pass Filter', 'High-Pass Filter', 'Band-Stop Filter', 'All-Pass Filter'],
        answer: 1
      },
      {
        type: 'mcq',
        question: 'ปรากฏการณ์ Clipping ในระบบเสียงดิจิทัลเกิดขึ้นเมื่อใด?',
        choices: [
          'ระดับสัญญาณเสียงเกินค่าสูงสุด (0 dBFS) จนยอดคลื่นถูกตัด',
          'ความถี่แซมปลิ้งสูงเกินไป',
          'สายสัญญาณมีความยาวมากเกินไป',
          'ปรับค่า Reverb น้อยเกินไป'
        ],
        answer: 0
      },

      // --- ส่วนที่ 2: ฟังเสียงแล้วเลือกช้อยส์ 5 ข้อ (เหมือน Posttest Ref รูปที่ 2) ---
      {
        type: 'audio',
        question: 'Choose the Processed Sound (Reverb)',
        subtitle: 'ฟังเสียงทั้ง 3 ตัวเลือก แล้วเลือกว่าเสียงใดถูกใส่เอฟเฟกต์ Reverb',
        effect: 'reverb',
        options: ['Sound A', 'Sound B', 'Sound C'],
        answer: 1 // ข้อ B
      },
      {
        type: 'audio',
        question: 'Choose the Processed Sound (Delay)',
        subtitle: 'ฟังเสียงทั้ง 3 ตัวเลือก แล้วเลือกว่าเสียงใดถูกใส่เอฟเฟกต์ Delay (เสียงสะท้อนเป็นจังหวะ)',
        effect: 'delay',
        options: ['Sound A', 'Sound B', 'Sound C'],
        answer: 0 // ข้อ A
      },
      {
        type: 'audio',
        question: 'Choose the Processed Sound (Pitch Shift Up)',
        subtitle: 'ฟังเสียงทั้ง 3 ตัวเลือก แล้วเลือกว่าเสียงใดถูกปรับระดับเสียง (Pitch) ให้สูงขึ้น',
        effect: 'pitchUp',
        options: ['Sound A', 'Sound B', 'Sound C'],
        answer: 2 // ข้อ C
      },
      {
        type: 'audio',
        question: 'Choose the Processed Sound (Pitch Shift Down)',
        subtitle: 'ฟังเสียงทั้ง 3 ตัวเลือก แล้วเลือกว่าเสียงใดถูกปรับระดับเสียง (Pitch) ให้ต่ำลง',
        effect: 'pitchDown',
        options: ['Sound A', 'Sound B', 'Sound C'],
        answer: 1 // ข้อ B
      },
      {
        type: 'audio',
        question: 'Choose the Processed Sound (Low-Pass Filter)',
        subtitle: 'ฟังเสียงทั้ง 3 ตัวเลือก แล้วเลือกว่าเสียงใดถูกตัดย่านความถี่แหลมออก (เสียงทุ้มอู้อี้)',
        effect: 'lowpass',
        options: ['Sound A', 'Sound B', 'Sound C'],
        answer: 0 // ข้อ A
      }
    ];

    const thaiPrefixes = ['ก', 'ข', 'ค', 'ง'];
    const engPrefixes = ['A', 'B', 'C'];
    const waveHeights = [14, 22, 12, 34, 42, 26, 18, 38, 46, 30, 16, 40, 32, 20, 44, 28, 15, 36, 24, 14];

    let currentIndex = 0;
    let userAnswers = new Array(questions.length).fill(null);
    let totalSeconds = 15 * 60; // 15 นาทีเหมือน Pretest
    let timerInterval = null;
    let audioCtx = null;
    let activeAudioSource = null;

    // เริ่มจับเวลา
    function startTimer() {
      timerInterval = setInterval(() => {
        if (totalSeconds <= 0) {
          clearInterval(timerInterval);
          submitQuiz();
          return;
        }
        totalSeconds--;
        updateTimerUI();
      }, 1000);
    }

    function updateTimerUI() {
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      const timeEl = document.getElementById('timerValue');
      const barEl = document.getElementById('timerBarFill');
      if (timeEl) {
        timeEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
      if (barEl) {
        const pct = (totalSeconds / (15 * 60)) * 100;
        barEl.style.width = `${pct}%`;
      }
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      const card = document.getElementById('quizCard');
      const selected = userAnswers[currentIndex];

      document.getElementById('topProgressText').textContent = `Question ${currentIndex + 1} of ${questions.length}`;
      const answeredCount = userAnswers.filter(a => a !== null).length;
      document.getElementById('answeredCounter').textContent = `${answeredCount} / ${questions.length} Answered`;

      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      const timeFormatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      const pct = (totalSeconds / (15 * 60)) * 100;

      let bodyHTML = '';

      if (q.type === 'mcq') {
        bodyHTML = `
          <div class="question-header">
            <span class="question-step">Question ${currentIndex + 1} of ${questions.length}</span>
            <span class="question-type-tag">Multiple Choice</span>
          </div>
          <h2 class="question-title">${q.question}</h2>
          <div class="choices-list">
            ${q.choices.map((choice, idx) => `
              <div class="choice-item ${selected === idx ? 'selected' : ''}" onclick="selectAnswer(${idx})">
                <div class="choice-prefix">${thaiPrefixes[idx]}</div>
                <div class="choice-text">${choice}</div>
              </div>
            `).join('')}
          </div>
        `;
      } else {
        // แบบฟังเสียง 3 ช้อยส์ (เหมือนรูปที่ 2)
        bodyHTML = `
          <div class="question-header">
            <span class="question-step">Question ${currentIndex + 1} of ${questions.length}</span>
            <span class="question-type-tag">🎧 Ear Training</span>
          </div>
          <h2 class="question-title">${q.question}</h2>
          <p class="question-subtitle">${q.subtitle}</p>

          <div class="audio-grid">
            ${q.options.map((opt, idx) => `
              <div class="audio-card ${selected === idx ? 'selected' : ''}" id="audioCard-${idx}" onclick="selectAnswer(${idx})">
                <div class="audio-card-label">${engPrefixes[idx]}.${opt}</div>
                <div class="waveform">
                  ${waveHeights.map(h => `<span class="wave-bar" style="height:${h}px"></span>`).join('')}
                </div>
                <button type="button" class="play-btn" onclick="event.stopPropagation(); playOptionSound(${idx})">
                  <span class="play-dot">&#9654;</span> Play
                </button>
              </div>
            `).join('')}
          </div>

          <div class="audio-radio-section">
            <div class="audio-radio-hint">🎧 Select one answer</div>
            <div class="audio-radio-group">
              ${engPrefixes.map((letter, idx) => `
                <div class="radio-option ${selected === idx ? 'selected' : ''}" onclick="selectAnswer(${idx})">
                  <span class="radio-circle"></span>
                  <span>${letter}</span>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      card.innerHTML = `
        ${bodyHTML}
        <div class="card-footer-hint">Select one answer to continue.</div>
        <div class="timer-row">
          <span class="timer-label">Time Remaining</span>
          <span class="timer-value" id="timerValue">${timeFormatted}</span>
        </div>
        <div class="timer-bar-bg">
          <div class="timer-bar-fill" id="timerBarFill" style="width: ${pct}%"></div>
        </div>
      `;

      // ปุ่ม Previous / Next
      document.getElementById('prevBtn').disabled = currentIndex === 0;
      const nextBtn = document.getElementById('nextBtn');
      nextBtn.disabled = selected === null;
      nextBtn.textContent = currentIndex === questions.length - 1 ? 'Submit Posttest' : 'Next';
    }

    function selectAnswer(idx) {
      userAnswers[currentIndex] = idx;
      renderQuestion();
    }

    function prevQuestion() {
      stopCurrentAudio();
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      stopCurrentAudio();
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        submitQuiz();
      }
    }

    // ระบบเล่นเสียงและใส่เอฟเฟกต์ Web Audio API
    function stopCurrentAudio() {
      document.querySelectorAll('.audio-card').forEach(el => el.classList.remove('playing'));
      if (activeAudioSource) {
        try { activeAudioSource.stop(); } catch (e) {}
        activeAudioSource = null;
      }
    }

    async function playOptionSound(optionIndex) {
      stopCurrentAudio();
      const q = questions[currentIndex];
      const cardEl = document.getElementById(`audioCard-${optionIndex}`);
      if (cardEl) cardEl.classList.add('playing');

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      const isProcessed = (optionIndex === q.answer);

      try {
        // โหลดไฟล์ assets/Bottle.mp3 ที่มีอยู่ในโฟลเดอร์โปรเจกต์
        const response = await fetch('assets/Bottle.mp3');
        const arrayBuffer = await response.arrayBuffer();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;
        activeAudioSource = source;

        if (!isProcessed) {
          // เสียงต้นฉบับ (Dry)
          source.connect(audioCtx.destination);
        } else {
          // เสียงที่ผ่านการ Process ตามโจทย์แต่ละข้อ
          if (q.effect === 'pitchUp') {
            source.playbackRate.value = 1.45;
            source.connect(audioCtx.destination);
          } else if (q.effect === 'pitchDown') {
            source.playbackRate.value = 0.72;
            source.connect(audioCtx.destination);
          } else if (q.effect === 'lowpass') {
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 420;
            source.connect(filter);
            filter.connect(audioCtx.destination);
          } else if (q.effect === 'delay') {
            const delay = audioCtx.createDelay();
            delay.delayTime.value = 0.28;
            const feedback = audioCtx.createGain();
            feedback.gain.value = 0.45;

            source.connect(audioCtx.destination);
            source.connect(delay);
            delay.connect(feedback);
            feedback.connect(delay);
            delay.connect(audioCtx.destination);
          } else if (q.effect === 'reverb') {
            // จำลอง Reverb ด้วย Impulse Response
            const convolver = audioCtx.createConvolver();
            const rate = audioCtx.sampleRate;
            const length = rate * 1.8;
            const impulse = audioCtx.createBuffer(2, length, rate);
            for (let ch = 0; ch < 2; ch++) {
              const data = impulse.getChannelData(ch);
              for (let i = 0; i < length; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.5);
              }
            }
            convolver.buffer = impulse;
            source.connect(convolver);
            convolver.connect(audioCtx.destination);
          }
        }

        source.onended = () => {
          if (cardEl) cardEl.classList.remove('playing');
        };
        source.start(0);
      } catch (err) {
        // Fallback กรณีเปิดไฟล์ตรงๆ โดยไม่ผ่าน Local Server (เช่น file://)
        playSynthFallback(isProcessed, q.effect, cardEl);
      }
    }

    function playSynthFallback(isProcessed, effect, cardEl) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = isProcessed && effect === 'pitchUp' ? 660 : (isProcessed && effect === 'pitchDown' ? 220 : 440);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.8);
      setTimeout(() => { if (cardEl) cardEl.classList.remove('playing'); }, 800);
    }

    function submitQuiz() {
      clearInterval(timerInterval);
      stopCurrentAudio();

      let score = 0;
      questions.forEach((q, i) => {
        if (userAnswers[i] === q.answer) score++;
      });

      // บันทึกคะแนนลง localStorage เผื่อหน้า profile.html ดึงไปแสดง
      localStorage.setItem('posttestScore', score);
      localStorage.setItem('posttestTotal', questions.length);

      document.getElementById('navActions').style.display = 'none';
      document.getElementById('bottomStatus').style.display = 'none';

      document.getElementById('quizCard').innerHTML = `
        <div class="result-box">
          <span class="question-type-tag">POSTTEST COMPLETED</span>
          <h2 class="question-title" style="margin-top:16px;">สรุปคะแนนแบบทดสอบหลังเรียน</h2>
          <div class="result-score">${score} / ${questions.length}</div>
          <p class="question-subtitle">บันทึกผลคะแนนเรียบร้อยแล้ว คุณสามารถกลับไปดูความคืบหน้าได้ที่หน้าหลัก</p>
          <button class="btn-next" style="margin-top:12px;" onclick="window.location.href='home.html'">กลับหน้าหลัก</button>
        </div>
      `;
    }

    // เริ่มทำงาน
    renderQuestion();
    startTimer();
  </script>
</body>
</html>
