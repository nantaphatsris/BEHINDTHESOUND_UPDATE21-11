<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Posttest | Behind The Sound</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #090807;
      --header-bg: #14110e;
      --orange: #ff8c3b;
      --orange-bright: #ffa35e;
      --gold: #e8a04d;
      --text: #f7f0e8;
      --muted: #c2afa0;
      --border-gold: rgba(232, 160, 77, 0.42);
      --post-card-grad: linear-gradient(115deg, #0b0908 0%, #1d120c 42%, #723819 82%, #9e5329 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-dark);
      background-image:
        linear-gradient(rgba(9, 8, 7, 0.9), rgba(9, 8, 7, 0.96)),
        repeating-linear-gradient(90deg, transparent 0px, transparent 39px, rgba(255, 140, 59, 0.06) 40px),
        repeating-linear-gradient(0deg, transparent 0px, transparent 39px, rgba(255, 140, 59, 0.06) 40px);
      color: var(--text);
      font-family: 'Montserrat', 'Kanit', sans-serif;
    }

    /* Header เหมือน Pretest */
    .quiz-header {
      width: 100%;
      height: 76px;
      padding: 0 25px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      background: rgba(20, 17, 14, 0.97);
      border-bottom: 1px solid var(--border-gold);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .back-button {
      justify-self: start;
      width: 40px;
      height: 45px;
      border: none;
      background: transparent;
      color: var(--orange);
      font-family: Arial, sans-serif;
      font-size: 36px;
      font-weight: 300;
      cursor: pointer;
    }

    .back-button:hover {
      color: #ffd09c;
    }

    .header-title {
      color: var(--text);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .header-space {
      width: 40px;
    }

    /* Main Container */
    .quiz-container {
      width: 100%;
      max-width: 780px;
      margin: auto;
      padding: 40px 22px 32px;
    }

    .quiz-top-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .quiz-top-info span:first-child {
      color: var(--orange);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .quiz-top-info span:last-child {
      color: var(--muted);
      font-size: 12px;
    }

    /* Question Card สีเหมือน Posttest Ref */
    .question-card {
      width: 100%;
      padding: 34px 30px 26px;
      background: var(--post-card-grad);
      border: 1.5px solid rgba(255, 140, 59, 0.45);
      border-radius: 20px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.65);
    }

    .question-progress-text {
      color: #ffb980;
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 14px;
    }

    .question-text {
      color: #ffffff;
      font-size: 19px;
      font-weight: 600;
      line-height: 1.55;
      margin-bottom: 24px;
      font-family: 'Kanit', 'Montserrat', sans-serif;
    }

    /* MCQ Choices (A, B, C, D) */
    .answer-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .answer-option {
      width: 100%;
      min-height: 58px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(10, 8, 7, 0.72);
      border: 1.5px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      color: #f5ede6;
      text-align: left;
      font-family: 'Kanit', sans-serif;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
    }

    .answer-option:hover {
      border-color: var(--orange);
      background: rgba(255, 140, 59, 0.14);
    }

    .answer-option.selected {
      background: linear-gradient(90deg, rgba(255, 140, 59, 0.32) 0%, rgba(168, 74, 24, 0.48) 100%);
      border-color: var(--orange);
      box-shadow: 0 0 14px rgba(255, 140, 59, 0.2);
    }

    .option-letter {
      min-width: 24px;
      color: var(--orange);
      font-family: 'Montserrat', sans-serif;
      font-size: 20px;
      font-weight: 700;
    }

    .option-text {
      line-height: 1.45;
    }

    /* Audio Comparison Cards (A, B, C เท่านั้น ไม่แสดงชื่อไฟล์) */
    .audio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }

    .audio-card {
      background: rgba(10, 8, 7, 0.84);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .audio-card:hover {
      border-color: var(--orange);
      transform: translateY(-2px);
    }

    .audio-card.selected {
      background: linear-gradient(180deg, rgba(186, 92, 36, 0.55) 0%, rgba(92, 44, 18, 0.72) 100%);
      border-color: var(--orange);
      box-shadow: 0 0 20px rgba(255, 140, 59, 0.24);
    }

    .audio-card-title {
      align-self: flex-start;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 14px;
    }

    .waveform {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 44px;
      width: 100%;
      margin-bottom: 16px;
    }

    .wave-bar {
      width: 3px;
      background-color: #ffffff;
      border-radius: 2px;
      transition: background-color 0.2s;
    }

    .audio-card.selected .wave-bar,
    .audio-card.playing .wave-bar {
      background-color: var(--orange);
    }

    .audio-card.playing .wave-bar {
      animation: wavePulse 0.55s infinite alternate ease-in-out;
    }

    @keyframes wavePulse {
      from { transform: scaleY(0.6); }
      to { transform: scaleY(1.3); }
    }

    .audio-toggle-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 96px;
      padding: 7px 16px;
      border-radius: 999px;
      border: 1px solid var(--orange);
      background: rgba(255, 140, 59, 0.14);
      color: var(--orange);
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .audio-toggle-btn:hover {
      background: var(--orange);
      color: #140903;
    }

    .audio-toggle-btn.playing {
      background: #ff5e3a;
      border-color: #ff5e3a;
      color: #ffffff;
    }

    .audio-select-row {
      text-align: center;
      margin-bottom: 14px;
    }

    .audio-select-label {
      font-size: 13px;
      color: #f2dfd0;
      margin-bottom: 12px;
    }

    .audio-radio-group {
      display: flex;
      justify-content: center;
      gap: 34px;
    }

    .audio-radio-btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
    }

    .radio-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.45);
      transition: 0.2s;
    }

    .audio-radio-btn.selected .radio-dot {
      border-color: var(--orange);
      background-color: var(--orange);
      box-shadow: 0 0 10px rgba(255, 140, 59, 0.65);
    }

    .answer-hint {
      min-height: 22px;
      margin-top: 14px;
      color: #d6c3b5;
      font-size: 11px;
      text-align: center;
    }

    /* Timer */
    .timer-section {
      margin-top: 10px;
    }

    .timer-text {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      color: #e0c5ad;
      font-size: 12px;
    }

    .timer-text strong {
      color: var(--orange);
      font-size: 16px;
    }

    .timer-track {
      width: 100%;
      height: 7px;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 20px;
      overflow: hidden;
    }

    .timer-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #ffad59, #e86b25);
      border-radius: 20px;
      transition: width 1s linear;
    }

    /* Navigation */
    .quiz-navigation {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-top: 42px;
    }

    .previous-button,
    .next-button {
      min-width: 145px;
      padding: 13px 25px;
      border-radius: 15px;
      font-family: 'Kanit', sans-serif;
      font-size: 15px;
      cursor: pointer;
      transition: 0.25s;
    }

    .previous-button {
      background: transparent;
      border: 1px solid var(--border-gold);
      color: #d4b895;
    }

    .previous-button:hover:not(:disabled) {
      background: rgba(255, 140, 59, 0.1);
      border-color: var(--orange);
    }

    .previous-button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .next-button {
      background: linear-gradient(135deg, #ffa85c, #e56f24);
      border: 1px solid #ffad66;
      color: #1c0e05;
      font-weight: 600;
    }

    .next-button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .next-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .bottom-progress {
      display: flex;
      justify-content: space-between;
      margin-top: 24px;
      color: #8f7e70;
      font-size: 10px;
      letter-spacing: 0.5px;
    }

    .save-status {
      margin-top: 12px;
      color: var(--orange);
      text-align: center;
      font-size: 12px;
    }

    /* Result Modal เหมือน Pretest */
    .result-overlay {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.85);
      z-index: 500;
    }

    .result-overlay.active {
      display: flex;
    }

    .result-card {
      width: 100%;
      max-width: 390px;
      padding: 35px 25px;
      text-align: center;
      background: #211d17;
      border: 1px solid var(--border-gold);
      border-radius: 20px;
    }

    .result-icon {
      width: 65px;
      height: 65px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--orange);
      border-radius: 50%;
      color: var(--orange);
      font-size: 30px;
    }

    .result-label {
      color: var(--orange);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .result-card h2 {
      margin-top: 12px;
      font-size: 24px;
    }

    .result-score {
      margin: 22px 0;
      color: var(--orange);
    }

    .result-score strong {
      font-size: 55px;
      font-weight: 800;
    }

    .result-score span {
      color: var(--muted);
      font-size: 22px;
    }

    .result-message {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .result-home-button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: none;
      border-radius: 25px;
      background: linear-gradient(135deg, #ffa85c, #e56f24);
      color: #1c0e05;
      font-family: 'Kanit', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    @media (max-width: 650px) {
      .audio-grid {
        grid-template-columns: 1fr;
      }
      .question-card {
        padding: 26px 16px 22px;
      }
    }
  </style>
</head>
<body>

  <header class="quiz-header">
    <button class="back-button" id="backButton" type="button" aria-label="Back to Home">‹</button>
    <div class="header-title">POSTTEST</div>
    <div class="header-space"></div>
  </header>

  <main class="quiz-container">
    <div class="quiz-top-info">
      <span>POSTTEST</span>
      <span id="questionNumber">Question 1 of 15</span>
    </div>

    <section class="question-card">
      <div class="question-progress-text" id="questionLabel">Question 1 of 15</div>
      <h2 class="question-text" id="questionText">Loading question...</h2>

      <div id="dynamicAnswerArea"></div>

      <p class="answer-hint" id="answerHint">Select one answer to continue.</p>

      <div class="timer-section">
        <div class="timer-text">
          <span>Time Remaining</span>
          <strong id="timer">15:00</strong>
        </div>
        <div class="timer-track">
          <div class="timer-fill" id="timerFill"></div>
        </div>
      </div>
    </section>

    <div class="quiz-navigation">
      <button type="button" class="previous-button" id="previousButton" disabled>Previous</button>
      <button type="button" class="next-button" id="nextButton" disabled>Next</button>
    </div>

    <div class="bottom-progress">
      <span id="answeredCount">0 / 15 Answered</span>
      <span>BEHIND THE SOUND</span>
    </div>

    <p class="save-status" id="saveStatus" role="status"></p>
  </main>

  <div class="result-overlay" id="resultOverlay">
    <div class="result-card">
      <div class="result-icon">✓</div>
      <p class="result-label">POSTTEST COMPLETED</p>
      <h2>Your Result</h2>
      <div class="result-score">
        <strong id="finalScore">0</strong>
        <span>/ 15</span>
      </div>
      <p class="result-message" id="resultMessage">Your answers have been submitted.</p>
      <button type="button" id="homeButton" class="result-home-button">Back to Home →</button>
    </div>
  </div>

  <script type="module">
    const TOTAL_QUESTIONS = 15;
    const TOTAL_TIME = 15 * 60;

    let currentQuestion = 0;
    let remainingTime = TOTAL_TIME;
    let currentUser = null;
    let db = null;
    let timerInterval = null;
    let isSubmitted = false;
    let isSaving = false;
    let userAnswers = Array(TOTAL_QUESTIONS).fill(null);

    // ตัวแปรควบคุมการเล่นเสียง (ไม่ลูป เล่นจบแล้วรีเซ็ตปุ่มเป็น Play)
    let currentAudio = null;
    let playingOptionIndex = null;

    const waveHeights = [14, 24, 12, 34, 42, 26, 18, 38, 44, 28, 16, 40, 30, 20, 42, 26, 15, 35, 22, 14];

    // คำตอบ: A = 0, B = 1, C = 2, D = 3
    const questions = [
      // ข้อ 1 - 10 (เลือกตอบ ช้อยส์ A B C D)
      {
        type: "mcq",
        question: "ข้อ 1 เสียงใดมีลักษณะก้องเหมือนอยู่ในห้องขนาดใหญ่",
        options: [
          "เสียงแห้ง ไม่มีเสียงก้อง",
          "เสียงก้องสั้น",
          "เสียงก้องยาว",
          "เสียงสะท้อนซ้ำอย่างชัดเจน"
        ],
        answer: 2 // ค
      },
      {
        type: "mcq",
        question: "ข้อ 2 เสียงใดลดเสียงความถี่ต่ำออกไป ทำให้เสียงพูดลดเสียงทุ้มรบกวน",
        options: [
          "เสียงปกติ",
          "เสียงผ่าน High-Pass Filter",
          "เสียงผ่าน Low-Pass Filter",
          "เสียงผ่าน Reverb"
        ],
        answer: 1 // ข
      },
      {
        type: "mcq",
        question: "ข้อ 3 เสียงใดมีการเล่นซ้ำตามหลังเสียงต้นฉบับ",
        options: [
          "เสียงผ่าน Delay",
          "เสียงผ่าน Reverb",
          "เสียงผ่าน Compressor",
          "เสียงผ่าน EQ"
        ],
        answer: 0 // ก
      },
      {
        type: "mcq",
        question: "ข้อ 4 เสียงใดมีระดับความดังสม่ำเสมอขึ้น โดยลดความแตกต่างระหว่างช่วงดังกับช่วงเบา",
        options: [
          "เสียงปกติ",
          "เสียงเพิ่มความถี่สูง",
          "เสียงผ่าน Compressor",
          "เสียงผ่าน Delay"
        ],
        answer: 2 // ค
      },
      {
        type: "mcq",
        question: "ข้อ 5 เสียงใดมีความทุ้มมากกว่าเสียงต้นฉบับ",
        options: [
          "เสียงเพิ่มความถี่ต่ำด้วย EQ",
          "เสียงเพิ่มความถี่สูงด้วย EQ",
          "เสียงผ่าน High-Pass Filter",
          "เสียงผ่าน Reverb"
        ],
        answer: 0 // ก
      },
      {
        type: "mcq",
        question: "ข้อ 6 เสียงใดลดความถี่สูง ทำให้เสียงแหลมน้อยลง",
        options: [
          "เสียงผ่าน High-Pass Filter",
          "เสียงผ่าน Low-Pass Filter",
          "เสียงผ่าน Delay",
          "เสียงผ่าน Compressor"
        ],
        answer: 1 // ข
      },
      {
        type: "mcq",
        question: "ข้อ 7 เสียงใดมีระดับเสียงสูงขึ้นจากต้นฉบับ",
        options: [
          "เสียงลด Pitch",
          "เสียงเพิ่ม Pitch",
          "เสียงเพิ่ม Reverb",
          "เสียงลด Gain"
        ],
        answer: 1 // ข
      },
      {
        type: "mcq",
        question: "ข้อ 8 เสียงใดมีลักษณะสะท้อนซ้ำเป็นจังหวะที่แยกจากเสียงต้นฉบับได้ชัดเจน",
        options: [
          "เสียงผ่าน Reverb",
          "เสียงผ่าน Compressor",
          "เสียงผ่าน Delay",
          "เสียงผ่าน Low-Pass Filter"
        ],
        answer: 2 // ค
      },
      {
        type: "mcq",
        question: "ข้อ 9 เสียงใดมีความดังของสัญญาณเพิ่มขึ้น แต่ลักษณะเสียงโดยรวมยังเหมือนต้นฉบับ",
        options: [
          "เสียงเพิ่ม Gain",
          "เสียงเพิ่ม Feedback",
          "เสียงเพิ่ม Decay",
          "เสียงเพิ่ม Q"
        ],
        answer: 0 // ก
      },
      {
        type: "mcq",
        question: "ข้อ 10 เสียงใดมีลักษณะเสียงชัดขึ้นจากการปรับระดับความถี่ให้เหมาะสม",
        options: [
          "เสียงผ่าน Delay",
          "เสียงผ่าน EQ",
          "เสียงผ่าน Reverb",
          "เสียงผ่าน Pitch Shifter"
        ],
        answer: 1 // ข (อ้างอิงลำดับคำตอบชุดข้อ 1-10)
      },

      // ข้อ 11 - 15 (ฟังเสียงแล้วเลือก A, B, C — ไม่แสดงชื่อไฟล์บนหน้าเว็บ)
      {
        type: "audio",
        question: "ข้อ 11 เสียงไหนเบาลงจากเสียงเดิม แต่ลักษณะเสียงยังเหมือนเดิม?",
        audioFiles: [
          "./assets/posttest/q11_a.wav", // A: Door Close Gain+.wav
          "./assets/posttest/q11_b.wav", // B: Door Close Gain-.wav
          "./assets/posttest/q11_c.wav"  // C: Door Close Pitch+.wav
        ],
        answer: 1 // B
      },
      {
        type: "audio",
        question: "ข้อ 12 เสียงนก เสียงไหนฟังดูทุ้มลงจากเสียงต้นฉบับ?",
        audioFiles: [
          "./assets/posttest/q12_a.wav", // A: Bird Chirp Pitch+.wav
          "./assets/posttest/q12_b.wav", // B: Bird Chirp Pitch-.wav
          "./assets/posttest/q12_c.wav"  // C: Bird Chirp Reverb.wav
        ],
        answer: 1 // B
      },
      {
        type: "audio",
        question: "ข้อ 13 เสียงไหนฟังดูทึบขึ้น เพราะเสียงแหลมถูกลดลง?",
        audioFiles: [
          "./assets/posttest/q13_a.wav", // A: Paper Crumple Low-Pass .wav
          "./assets/posttest/q13_b.wav", // B: Paper Crumple High-Pass.wav
          "./assets/posttest/q13_c.wav"  // C: Paper Crumple EQ.wav
        ],
        answer: 0 // A
      },
      {
        type: "audio",
        question: "ข้อ 14 เสียงไหนฟังดูก้องเหมือนอยู่ในห้องกว้าง?",
        audioFiles: [
          "./assets/posttest/q14_a.wav", // A: Keys Dropping Compressor.wav
          "./assets/posttest/q14_b.wav", // B: Keys Dropping Reverb.wav
          "./assets/posttest/q14_c.wav"  // C: Keys Dropping High-pass.wav
        ],
        answer: 1 // B
      },
      {
        type: "audio",
        question: "ข้อ 15 เสียงไหนมีระดับความดังสม่ำเสมอขึ้น ช่วงที่ดังมากถูกลดลง?",
        audioFiles: [
          "./assets/posttest/q15_a.wav", // A: Car Passing By Delay.wav
          "./assets/posttest/q15_b.wav", // B: Car Passing By Pitch Shifter.wav
          "./assets/posttest/q15_c.wav"  // C: Car Passing By Compressor.wav
        ],
        answer: 2 // C
      }
    ];

    // DOM Elements
    const questionNumber = document.getElementById("questionNumber");
    const questionLabel = document.getElementById("questionLabel");
    const questionText = document.getElementById("questionText");
    const dynamicAnswerArea = document.getElementById("dynamicAnswerArea");
    const answerHint = document.getElementById("answerHint");
    const previousButton = document.getElementById("previousButton");
    const nextButton = document.getElementById("nextButton");
    const answeredCount = document.getElementById("answeredCount");
    const timerElement = document.getElementById("timer");
    const timerFill = document.getElementById("timerFill");
    const backButton = document.getElementById("backButton");
    const resultOverlay = document.getElementById("resultOverlay");
    const finalScore = document.getElementById("finalScore");
    const resultMessage = document.getElementById("resultMessage");
    const homeButton = document.getElementById("homeButton");
    const saveStatus = document.getElementById("saveStatus");

    function stopAudioPlayback() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio.onended = null;
        currentAudio = null;
      }
      playingOptionIndex = null;
      syncAudioButtonsUI();
    }

    function syncAudioButtonsUI() {
      document.querySelectorAll(".audio-card").forEach((card, idx) => {
        card.classList.toggle("playing", playingOptionIndex === idx);
      });
      document.querySelectorAll(".audio-toggle-btn").forEach((btn, idx) => {
        const isPlaying = playingOptionIndex === idx;
        btn.classList.toggle("playing", isPlaying);
        btn.innerHTML = isPlaying ? "■ Stop" : "▶ Play";
      });
    }

    function toggleAudioOption(optIndex) {
      const q = questions[currentQuestion];
      if (!q || q.type !== "audio") return;

      // ถ้ากดปุ่มเดิมที่กำลังเล่นอยู่ -> หยุดเล่นทันที
      if (playingOptionIndex === optIndex && currentAudio) {
        stopAudioPlayback();
        return;
      }

      // หยุดเสียงอื่นก่อน แล้วเริ่มเล่นเสียงใหม่ (loop = false ตามค่าเริ่มต้น)
      stopAudioPlayback();

      const audio = new Audio(q.audioFiles[optIndex]);
      audio.loop = false;
      currentAudio = audio;
      playingOptionIndex = optIndex;
      syncAudioButtonsUI();

      // เล่นจบแล้วหยุด และเปลี่ยนปุ่มกลับเป็น Play อัตโนมัติ
      audio.onended = () => {
        if (currentAudio === audio) {
          currentAudio = null;
          playingOptionIndex = null;
          syncAudioButtonsUI();
        }
      };

      audio.onerror = () => {
        if (currentAudio === audio) {
          currentAudio = null;
          playingOptionIndex = null;
          syncAudioButtonsUI();
        }
      };

      audio.play().catch(() => {
        if (currentAudio === audio) {
          currentAudio = null;
          playingOptionIndex = null;
          syncAudioButtonsUI();
        }
      });
    }

    function renderQuestion() {
      stopAudioPlayback();

      const q = questions[currentQuestion];
      const num = currentQuestion + 1;
      const selected = userAnswers[currentQuestion];

      questionNumber.textContent = `Question ${num} of ${TOTAL_QUESTIONS}`;
      questionLabel.textContent = `Question ${num} of ${TOTAL_QUESTIONS}`;
      questionText.textContent = q.question;
      dynamicAnswerArea.innerHTML = "";

      if (q.type === "mcq") {
        const letters = ["A", "B", "C", "D"];
        const list = document.createElement("div");
        list.className = "answer-list";

        q.options.forEach((optText, idx) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "answer-option" + (selected === idx ? " selected" : "");

          const letterSpan = document.createElement("span");
          letterSpan.className = "option-letter";
          letterSpan.textContent = letters[idx];

          const textSpan = document.createElement("span");
          textSpan.className = "option-text";
          textSpan.textContent = optText;

          btn.appendChild(letterSpan);
          btn.appendChild(textSpan);
          btn.addEventListener("click", () => selectAnswer(idx));
          list.appendChild(btn);
        });

        dynamicAnswerArea.appendChild(list);
      } else {
        const letters = ["A", "B", "C"];
        const grid = document.createElement("div");
        grid.className = "audio-grid";

        letters.forEach((letter, idx) => {
          const card = document.createElement("div");
          card.className = "audio-card" + (selected === idx ? " selected" : "");
          card.addEventListener("click", () => selectAnswer(idx));

          const title = document.createElement("div");
          title.className = "audio-card-title";
          title.textContent = letter;

          const wave = document.createElement("div");
          wave.className = "waveform";
          waveHeights.forEach((h) => {
            const bar = document.createElement("span");
            bar.className = "wave-bar";
            bar.style.height = `${h}px`;
            wave.appendChild(bar);
          });

          const toggleBtn = document.createElement("button");
          toggleBtn.type = "button";
          toggleBtn.className = "audio-toggle-btn";
          toggleBtn.innerHTML = "▶ Play";
          toggleBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            toggleAudioOption(idx);
          });

          card.appendChild(title);
          card.appendChild(wave);
          card.appendChild(toggleBtn);
          grid.appendChild(card);
        });

        const radioSection = document.createElement("div");
        radioSection.className = "audio-select-row";

        const radioLabel = document.createElement("div");
        radioLabel.className = "audio-select-label";
        radioLabel.textContent = "Select one answer";

        const radioGroup = document.createElement("div");
        radioGroup.className = "audio-radio-group";

        letters.forEach((letter, idx) => {
          const radioBtn = document.createElement("div");
          radioBtn.className = "audio-radio-btn" + (selected === idx ? " selected" : "");
          radioBtn.addEventListener("click", () => selectAnswer(idx));

          const dot = document.createElement("span");
          dot.className = "radio-dot";

          const txt = document.createElement("span");
          txt.textContent = letter;

          radioBtn.appendChild(dot);
          radioBtn.appendChild(txt);
          radioGroup.appendChild(radioBtn);
        });

        radioSection.appendChild(radioLabel);
        radioSection.appendChild(radioGroup);

        dynamicAnswerArea.appendChild(grid);
        dynamicAnswerArea.appendChild(radioSection);
      }

      previousButton.disabled = currentQuestion === 0;
      nextButton.textContent = currentQuestion === TOTAL_QUESTIONS - 1 ? "Submit" : "Next";
      nextButton.disabled = selected === null;
      answerHint.textContent = selected === null ? "Select one answer to continue." : "Answer selected.";
      updateAnsweredCount();
    }

    function selectAnswer(index) {
      if (isSubmitted || isSaving) return;
      userAnswers[currentQuestion] = index;

      if (questions[currentQuestion].type === "mcq") {
        document.querySelectorAll(".answer-option").forEach((el, idx) => {
          el.classList.toggle("selected", idx === index);
        });
      } else {
        document.querySelectorAll(".audio-card").forEach((el, idx) => {
          el.classList.toggle("selected", idx === index);
        });
        document.querySelectorAll(".audio-radio-btn").forEach((el, idx) => {
          el.classList.toggle("selected", idx === index);
        });
      }

      nextButton.disabled = false;
      answerHint.textContent = "Answer selected.";
      updateAnsweredCount();
    }

    function updateAnsweredCount() {
      const count = userAnswers.filter((a) => a !== null).length;
      answeredCount.textContent = `${count} / ${TOTAL_QUESTIONS} Answered`;
    }

    nextButton.addEventListener("click", () => {
      if (isSubmitted || isSaving || userAnswers[currentQuestion] === null) return;
      if (currentQuestion === TOTAL_QUESTIONS - 1) {
        submitQuiz(false);
        return;
      }
      currentQuestion++;
      renderQuestion();
    });

    previousButton.addEventListener("click", () => {
      if (isSubmitted || isSaving || currentQuestion <= 0) return;
      currentQuestion--;
      renderQuestion();
    });

    function goHome() {
      stopAudioPlayback();
      window.location.assign("./home.html");
    }

    backButton.addEventListener("click", goHome);
    homeButton.addEventListener("click", goHome);

    function startTimer() {
      if (timerInterval) return;
      timerInterval = setInterval(() => {
        if (isSubmitted || isSaving) return;
        remainingTime--;
        updateTimerDisplay();
        if (remainingTime <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          submitQuiz(true);
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const minutes = Math.floor(remainingTime / 60);
      const seconds = remainingTime % 60;
      timerElement.textContent = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      timerFill.style.width = `${(remainingTime / TOTAL_TIME) * 100}%`;

      if (remainingTime <= 60) {
        timerElement.style.color = "#ff7770";
        timerFill.style.background = "#ff7770";
      }
    }

    function calculateScore() {
      let score = 0;
      questions.forEach((q, i) => {
        if (userAnswers[i] === q.answer) score++;
      });
      return score;
    }

    async function initializeFirebase() {
      try {
        const configModule = await import("./firebase-config.js");
        const { firebaseConfig } = configModule;
        const appModule = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
        const authModule = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
        const firestoreModule = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");

        const app = appModule.getApps().length ? appModule.getApp() : appModule.initializeApp(firebaseConfig);
        const auth = authModule.getAuth(app);
        db = firestoreModule.getFirestore(app);

        await new Promise((resolve) => {
          authModule.onAuthStateChanged(auth, (user) => {
            currentUser = user;
            resolve();
          }, () => resolve());
        });
      } catch (error) {
        console.error("Firebase connection error:", error);
      }
    }

    async function firestoreAddResult(score, timeUp) {
      const firestoreModule = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
      await firestoreModule.addDoc(
        firestoreModule.collection(db, "users", currentUser.uid, "learningResults"),
        {
          type: "posttest",
          score: score,
          maxScore: TOTAL_QUESTIONS,
          completed: true,
          answers: userAnswers,
          timeUsed: TOTAL_TIME - remainingTime,
          timeUp: timeUp,
          createdAt: firestoreModule.serverTimestamp()
        }
      );
    }

    async function submitQuiz(timeUp = false) {
      if (isSubmitted || isSaving) return;

      if (!timeUp && !userAnswers.every((a) => a !== null)) {
        answerHint.textContent = "Please answer all questions before submitting.";
        return;
      }

      stopAudioPlayback();
      isSaving = true;
      nextButton.disabled = true;
      previousButton.disabled = true;
      clearInterval(timerInterval);
      timerInterval = null;

      const score = calculateScore();
      saveStatus.textContent = "Saving your result...";

      try {
        await firebaseReady;
        if (!currentUser || !db) throw new Error("User is not authenticated.");
        await firestoreAddResult(score, timeUp);
        isSubmitted = true;
        saveStatus.textContent = "";
        showResult(score, timeUp, true);
      } catch (error) {
        console.error("Posttest save error:", error);
        isSubmitted = true;
        saveStatus.textContent = "";
        showResult(score, timeUp, false);
      }
    }

    function showResult(score, timeUp, saved) {
      finalScore.textContent = score;
      if (saved) {
        resultMessage.textContent = timeUp
          ? "Time is up! Your posttest result has been saved."
          : "Your posttest result has been saved successfully.";
      } else {
        resultMessage.textContent =
          "Your score has been calculated, but the result could not be saved to Firebase. Please check your login and connection.";
      }
      resultOverlay.classList.add("active");
    }

    renderQuestion();
    updateTimerDisplay();
    startTimer();
    const firebaseReady = initializeFirebase();
  </script>
</body>
</html>
