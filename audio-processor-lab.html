<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Processor Lab | Behind The Sound</title>
  <style>

/* =========================================
   BEHIND THE SOUND
   SOUND FUNDAMENTALS
   DARK GOLD THEME
========================================= */

:root {
  --bg: #100e0c;
  --panel: #211d18;
  --panel-light: #29241e;
  --orange: #ff9d43;
  --gold: #e8a04d;
  --text: #f4e7d9;
  --muted: #c6b7a9;
  --border: rgba(255,157,67,.3);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  overflow-x: hidden;

  background:
    radial-gradient(
      ellipse at 50% 35%,
      rgba(192,95,25,.08),
      transparent 60%
    ),
    #100e0c;

  color: var(--text);
  font-family: 'Kanit', sans-serif;
}

button, a {
  font: inherit;
}


/* =========================================
   HEADER
========================================= */

.fundamentals-header {
  width: 100%;
  height: 75px;
  padding: 0 30px;

  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;

  background: rgba(20,17,14,.97);
  border-bottom: 1px solid var(--border);

  position: sticky;
  top: 0;
  z-index: 100;
}

.back-button {
  justify-self: start;

  width: 42px;
  height: 45px;

  border: none;
  background: transparent;

  color: var(--orange);
  font-size: 38px;
  font-weight: 300;

  cursor: pointer;
  transition: .2s;
}

.back-button:hover {
  color: #ffd09c;
  transform: translateX(-3px);
}

.header-title {
  color: var(--text);
  font-family: 'Montserrat', sans-serif;
  font-size: 18px;
  font-weight: 600;
}

.header-space {
  width: 42px;
}


/* =========================================
   MAIN CONTAINER
========================================= */

.fundamentals-container {
  width: 100%;
  max-width: 1200px;

  margin: auto;
  padding: 65px 45px 50px;
}


/* =========================================
   PAGE HEADING
========================================= */

.page-heading {
  margin-bottom: 35px;
}

.page-heading h1 {
  color: var(--orange);

  font-family: 'Montserrat', sans-serif;
  font-size: clamp(34px, 5vw, 52px);
  font-weight: 800;
  letter-spacing: -1.5px;
}


/* =========================================
   TOPIC CARDS
========================================= */

.topic-list {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.topic-card {
  position: relative;

  width: 100%;
  min-height: 155px;

  padding: 30px 35px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  background:
    linear-gradient(
      145deg,
      rgba(46,39,31,.98),
      rgba(25,22,18,.98)
    );

  border: 1px solid var(--border);
  border-radius: 18px;

  text-decoration: none;
  color: var(--text);

  transition: .3s;
}

.topic-card:hover {
  border-color: var(--orange);
  background:
    linear-gradient(
      145deg,
      rgba(65,48,33,.98),
      rgba(30,24,18,.98)
    );

  transform: translateY(-3px);
  box-shadow: 0 12px 30px rgba(0,0,0,.3);
}

.topic-card h2 {
  color: #f4bd87;

  font-family: 'Montserrat', sans-serif;
  font-size: clamp(21px, 3vw, 28px);
  font-weight: 700;
}

.topic-arrow {
  color: var(--orange);
  font-size: 42px;
  font-weight: 300;

  transition: .2s;
}

.topic-card:hover .topic-arrow {
  transform: translateX(6px);
}


/* =========================================
   LESSON CONTENT
========================================= */

.lesson-page-heading {
  margin-bottom: 28px;
}

.lesson-page-heading h1 {
  color: var(--orange);

  font-family: 'Montserrat', sans-serif;
  font-size: clamp(30px, 5vw, 43px);
  font-weight: 800;
}

.content-card {
  padding: 28px 30px;
  margin-bottom: 20px;

  background: rgba(40,39,32,.97);

  border: 1px solid var(--border);
  border-radius: 16px;

  box-shadow: 0 8px 22px rgba(0,0,0,.16);
}

.content-card h3 {
  margin-bottom: 15px;

  color: var(--orange);
  font-size: 20px;
  font-weight: 500;
}

.content-card h4 {
  margin: 20px 0 10px;

  color: #e7c49d;
  font-size: 16px;
  font-weight: 500;
}

.content-card p {
  margin-bottom: 14px;

  color: #e3d9cd;
  font-size: 14px;
  font-weight: 300;
  line-height: 1.95;
}

.content-card p:last-child {
  margin-bottom: 0;
}


/* =========================================
   FOOTER
========================================= */

.lesson-footer {
  margin-top: 45px;
  padding: 20px 0;

  border-top: 1px solid var(--border);

  color: #867767;
  font-family: 'Montserrat', sans-serif;
  font-size: 10px;
  letter-spacing: 1px;
  text-align: center;
}


/* =========================================
   RESPONSIVE TABLET & MOBILE
========================================= */

@media (max-width: 800px) {
  .fundamentals-container {
    padding: 55px 30px 40px;
  }
}

@media (max-width: 600px) {
  .fundamentals-header {
    height: 65px;
    padding: 0 16px;
  }

  .header-title {
    font-size: 14px;
  }

  .fundamentals-container {
    padding: 40px 17px 35px;
  }

  .page-heading {
    margin-bottom: 25px;
  }

  .page-heading h1 {
    font-size: 30px;
  }

  .topic-list {
    gap: 14px;
  }

  .topic-card {
    min-height: 115px;
    padding: 23px 22px;
    border-radius: 14px;
  }

  .topic-card h2 {
    font-size: 19px;
  }

  .topic-arrow {
    font-size: 35px;
  }

  .content-card {
    padding: 22px 18px;
    border-radius: 13px;
  }

  .content-card h3 {
    font-size: 17px;
  }

  .content-card p {
    font-size: 13px;
    line-height: 1.9;
  }
}


/* =========================================
   FILTER LESSON + INTERACTIVE FILTER LAB
========================================= */

.filter-bullet-list {
  margin: 8px 0 15px 22px;
  color: #e3d9cd;
  font-size: 14px;
  font-weight: 300;
  line-height: 1.95;
}

.filter-bullet-list li { padding-left: 4px; margin-bottom: 3px; }
.filter-lab-section { margin-top: 24px; }
.filter-lab-panel {
  padding: 22px;
  background: linear-gradient(145deg, rgba(38,33,27,.98), rgba(24,21,17,.98));
  border: 1px solid var(--border);
  border-radius: 18px;
  box-shadow: 0 12px 30px rgba(0,0,0,.22);
}
.filter-chart-wrap {
  width:100%; height:360px; overflow:hidden;
  background:rgba(13,11,9,.55);
  border:1px solid rgba(232,160,77,.2); border-radius:12px;
}
#filterResponseChart { display:block; width:100%; height:360px; cursor: crosshair; }
.filter-control { min-width:0; padding:16px; background:rgba(255,255,255,.025); border:1px solid rgba(232,160,77,.16); border-radius:12px; }
.filter-control label { display:block; margin-bottom:9px; color:#e7c49d; font-size:13px; font-weight:500; }
.filter-label-line { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.filter-label-line output { color:var(--orange); font:600 12px 'Montserrat',sans-serif; white-space:nowrap; }
.filter-control select {
  width:100%; min-height:42px; padding:9px 12px;
  color:var(--text); background:#17130f;
  border:1px solid rgba(232,160,77,.35); border-radius:8px;
  outline:none; font:400 13px 'Kanit',sans-serif;
}
.filter-control input[type="range"] { width:100%; accent-color:var(--orange); cursor:pointer; }
.filter-range-labels { display:flex; justify-content:space-between; color:#998978; font-size:10px; }
.filter-control small { display:block; margin-top:7px; color:#a99886; font-size:10px; }
.filter-readout { margin-top:18px; padding:13px 15px; color:#ffd09c; background:rgba(255,157,67,.08); border:1px solid rgba(255,157,67,.22); border-radius:9px; font-size:12px; line-height:1.7; }

.filter-player-controls { display:grid; grid-template-columns:auto minmax(80px,1fr) auto; align-items:center; gap:13px; }
.filter-player-controls button {
  min-width:100px; padding:10px 15px; color:#21160c; background:#ffad59;
  border:0; border-radius:8px; cursor:pointer; font:700 12px 'Montserrat',sans-serif;
}
.filter-player-controls button:hover { background:#ffc17e; }
.filter-player-controls input[type="range"] { width:100%; accent-color:#ffad59; cursor:pointer; }
.filter-player-controls span { color:#d2b99e; font:11px 'Montserrat',sans-serif; white-space:nowrap; }
.filter-audio-status { margin-top:10px; color:#a99886; font-size:11px; }
@media(max-width:600px) {
  .filter-lab-panel { padding:15px 12px; border-radius:14px; }
  .filter-player-controls { grid-template-columns:1fr auto; gap:10px; }
  .filter-player-controls button { grid-column:1/-1; }
  .filter-chart-wrap, #filterResponseChart { height:300px; }
  .filter-bullet-list { font-size:13px; }
}


/* =========================================
   EQ LESSON + PARAMETRIC EQ LAB
========================================= */
.eq-theory-card { margin-bottom: 30px; }
.eq-lab-panel {
  margin-top: 28px; padding: 23px;
  background: linear-gradient(145deg, rgba(38,33,27,.98), rgba(24,21,17,.98));
  border: 1px solid var(--border); border-radius: 18px;
  box-shadow: 0 12px 30px rgba(0,0,0,.22);
}
.eq-lab-head { display:flex; justify-content:space-between; align-items:flex-start; gap:15px; margin-bottom:18px; }
.eq-lab-head h2 { margin:0 0 7px; color:var(--orange); font:700 clamp(22px,4vw,30px) 'Montserrat',sans-serif; }
.eq-live-state { display:flex; align-items:center; gap:8px; color:#b8d8c9; font:700 10px 'Montserrat',sans-serif; letter-spacing:1px; white-space:nowrap; padding:9px 11px; border:1px solid rgba(115,196,157,.25); border-radius:30px; background:rgba(115,196,157,.06); }
.eq-live-state i { width:7px;height:7px;border-radius:50%;background:#76c99e;box-shadow:0 0 9px rgba(118,201,158,.7); }
.eq-chart-shell { padding:13px 13px 10px; background:rgba(13,11,9,.6); border:1px solid rgba(232,160,77,.2); border-radius:13px; }
.eq-chart-top { display:flex; justify-content:space-between; gap:10px; margin:2px 3px 8px; color:#bca995; font:700 9px 'Montserrat',sans-serif; letter-spacing:1.2px; }
#eqResponseChart { display:block; width:100%; height:390px; cursor:crosshair; }
.eq-chart-foot { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; padding:8px 3px 1px; color:#a99a89; font-size:10px; }
.eq-chart-foot span { display:flex; align-items:center; gap:7px; }
.eq-legend-curve { width:18px;height:3px;border-radius:4px;background:#ffb15f; }
.eq-legend-speech { width:18px;height:8px;border-radius:2px;background:rgba(86,190,160,.45); }
.eq-legend-spectrum { width:18px;height:3px;border-radius:4px;background:#62d9ad;box-shadow:0 0 7px rgba(98,217,173,.45); }
.eq-speech-guide { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:13px; padding:13px; background:rgba(255,255,255,.025); border:1px solid rgba(232,160,77,.13); border-radius:11px; }
.eq-speech-guide > strong { width:100%; color:#e7c49d; font-size:12px; }
.eq-speech-band { padding:7px 9px; color:#c7d9d4; background:rgba(86,170,190,.08); border:1px solid rgba(86,170,190,.16); border-radius:7px; font-size:10px; }
.eq-speech-band b { color:#9de0c0; font-weight:600; }
.eq-speech-guide small { width:100%; color:#9e9184; font-size:10px; line-height:1.6; }
.eq-tools-row { display:flex; flex-wrap:wrap; align-items:center; gap:9px; margin:15px 0; }
.eq-action-button { padding:9px 13px; color:#21160c; background:#ffad59; border:0; border-radius:8px; cursor:pointer; font:700 11px 'Montserrat',sans-serif; }
.eq-action-button.secondary { color:#e7c49d; background:rgba(255,255,255,.04); border:1px solid rgba(232,160,77,.25); }
.eq-action-button:disabled { opacity:.35; cursor:not-allowed; }
#eqBandCount { margin-left:auto; color:#a99886; font:11px 'Montserrat',sans-serif; }
.eq-selected-panel { padding:16px; background:rgba(255,255,255,.025); border:1px solid rgba(232,160,77,.18); border-radius:12px; }
.eq-selected-title { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:14px; }
.eq-selected-title strong { color:#ffd09c; font:700 13px 'Montserrat',sans-serif; }
.eq-selected-title span { color:#ad9b87; font:700 9px 'Montserrat',sans-serif; letter-spacing:1px; }
.eq-control-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px 18px; }
.eq-control { display:block; min-width:0; color:#e7c49d; font-size:11px; }
.eq-control > span { display:flex; justify-content:space-between; gap:8px; margin-bottom:7px; }
.eq-control output { color:#ffb15f; font:600 11px 'Montserrat',sans-serif; }
.eq-control select { width:100%; min-height:38px; padding:8px 10px; color:#f1e5d8; background:#17130f; border:1px solid rgba(232,160,77,.3); border-radius:7px; font:12px 'Kanit',sans-serif; }
.eq-control input[type=range] { width:100%; accent-color:#ffad59; cursor:pointer; }
.eq-hint { margin-top:13px; color:#a99886; font-size:10px; line-height:1.7; }
.eq-readout { margin-top:14px; padding:12px 14px; color:#ffd09c; background:rgba(255,157,67,.08); border:1px solid rgba(255,157,67,.2); border-radius:9px; font-size:11px; line-height:1.7; }
@media(max-width:600px) {
  .eq-lab-panel { padding:14px 11px; border-radius:14px; }
  .eq-lab-head { flex-direction:column; }
  #eqResponseChart { height:320px; }
  .eq-control-grid { grid-template-columns:1fr; gap:12px; }
}


/* =========================================
   COMPRESSOR LESSON + INTERACTIVE LAB
========================================= */
.compressor-theory-card { margin-bottom: 26px; }
.compressor-parameter-list li { margin-bottom: 5px; }
.compressor-tip { margin-top: 13px; padding: 11px 13px; color: #e8caa8; background: rgba(255,157,67,.07); border-left: 3px solid var(--orange); border-radius: 5px; font-size: 12px; line-height: 1.75; }
.compressor-lab { margin-top: 25px; }
.compressor-lab-head { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:16px; }
.compressor-lab-head h2 { margin:0 0 6px; color:var(--orange); font:700 clamp(22px,4vw,30px) 'Montserrat',sans-serif; }
.compressor-live-pill { display:flex; align-items:center; gap:8px; flex-shrink:0; padding:8px 11px; color:#b8d8c9; background:rgba(115,196,157,.06); border:1px solid rgba(115,196,157,.25); border-radius:30px; font:700 9px 'Montserrat',sans-serif; letter-spacing:1px; }
.compressor-live-pill i { width:7px;height:7px;border-radius:50%;background:#76c99e;box-shadow:0 0 9px rgba(118,201,158,.7); }
.compressor-main-panel { padding:20px; background:linear-gradient(145deg,rgba(38,33,27,.98),rgba(24,21,17,.98)); border:1px solid var(--border); border-radius:17px; box-shadow:0 12px 30px rgba(0,0,0,.2); }
.compressor-graph-top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:1px 2px 8px; color:#e8c49d; font:700 10px 'Montserrat',sans-serif; letter-spacing:1px; }
.compressor-graph-top span { color:#9e9081; font:10px 'Kanit',sans-serif; letter-spacing:0; }
.compressor-graph-legend { display:flex; flex-wrap:wrap; gap:14px; margin:9px 2px 17px; color:#a99a89; font-size:10px; }
.compressor-graph-legend span { display:flex; align-items:center; gap:6px; }
.compressor-graph-legend i { display:inline-block; width:17px; height:3px; border-radius:4px; }
.compressor-meter-row { display:grid; grid-template-columns:minmax(220px,1.5fr) repeat(2,minmax(115px,.7fr)); gap:10px; align-items:stretch; margin-bottom:17px; }
.compressor-meter-card,.compressor-level-card { min-width:0; padding:13px; background:rgba(255,255,255,.03); border:1px solid rgba(232,160,77,.14); border-radius:10px; }
.compressor-meter-heading { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; }
.compressor-meter-heading strong,.compressor-level-card span { color:#bba68f; font:700 9px 'Montserrat',sans-serif; letter-spacing:1px; }
.compressor-meter-heading output { color:#ffb15f; font:700 14px 'Montserrat',sans-serif; white-space:nowrap; }
.compressor-meter-track { height:13px; overflow:hidden; background:#0d0c0b; border:1px solid rgba(255,255,255,.08); border-radius:20px; }
#compReductionBar { width:0%; height:100%; background:linear-gradient(90deg,#72c99e,#e9c46a,#ff925e); border-radius:20px; transition:width .08s linear; }
.compressor-meter-scale { display:flex; justify-content:space-between; margin-top:6px; color:#887d71; font:8px 'Montserrat',sans-serif; }
.compressor-level-card { display:flex; flex-direction:column; justify-content:center; gap:9px; }
.compressor-level-card strong { color:#e9d8c5; font:600 15px 'Montserrat',sans-serif; white-space:nowrap; }
.compressor-controls { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.compressor-control { min-width:0; padding:13px 14px; background:rgba(255,255,255,.025); border:1px solid rgba(232,160,77,.15); border-radius:10px; }
.compressor-control label { display:flex; justify-content:space-between; align-items:center; gap:7px; margin-bottom:8px; color:#e7c49d; font-size:12px; font-weight:500; }
.compressor-control output { color:#ffb15f; font:600 11px 'Montserrat',sans-serif; white-space:nowrap; }
.compressor-control input[type=range] { width:100%; accent-color:#ffad59; cursor:pointer; }
.compressor-control small { display:block; margin-top:4px; color:#9e9081; font-size:10px; line-height:1.5; }
.compressor-readout { margin-top:14px; padding:11px 13px; color:#ffd09c; background:rgba(255,157,67,.08); border:1px solid rgba(255,157,67,.2); border-radius:9px; font-size:11px; line-height:1.7; }
.compressor-note { margin-top:10px; color:#a99886; font-size:10px; line-height:1.7; }
.compressor-ab-panel { display:grid; grid-template-columns:1fr auto; gap:9px 18px; align-items:center; margin-bottom:18px; padding:15px 16px; background:rgba(255,255,255,.025); border:1px solid rgba(232,160,77,.2); border-radius:12px; }
.compressor-ab-panel > div:first-child { display:flex; flex-direction:column; gap:4px; }
.compressor-ab-panel > div:first-child strong,.compressor-preset-row > span { color:#e8c49d; font:700 10px 'Montserrat',sans-serif; letter-spacing:1px; }
.compressor-ab-panel small { color:#a99886; font-size:11px; }
.compressor-ab-buttons { display:flex; gap:7px; }
.compressor-ab-buttons button,.compressor-preset-row button { padding:9px 12px; color:#cdbba8; background:#211d18; border:1px solid rgba(232,160,77,.25); border-radius:8px; font:600 10px 'Kanit',sans-serif; cursor:pointer; transition:.18s ease; }
.compressor-ab-buttons button.active { color:#21170e; background:#ffb15f; border-color:#ffb15f; }
.compressor-mode-description { grid-column:1/-1; padding-top:8px; color:#c5ad92; border-top:1px solid rgba(255,255,255,.06); font-size:11px; }
.compressor-meter-caption { display:block; margin-top:7px; color:#a99886; font-size:10px; }
.compressor-makeup-summary { display:flex; flex-wrap:wrap; align-items:center; gap:9px 13px; margin:-5px 0 17px; padding:12px 14px; background:rgba(255,177,95,.055); border:1px solid rgba(255,177,95,.2); border-radius:10px; }
.compressor-makeup-summary span { color:#c9b39b; font-size:11px; }
.compressor-makeup-summary strong { color:#ffb15f; font:700 15px 'Montserrat',sans-serif; }
.compressor-makeup-summary small { flex-basis:100%; color:#998978; font-size:10px; }
.compressor-preset-row { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:14px; }
.compressor-preset-row > span { margin-right:4px; }
.compressor-character-description { margin-top:9px; padding:10px 12px; color:#c6b19a; background:rgba(255,255,255,.025); border-left:3px solid #bd8550; border-radius:5px; font-size:11px; line-height:1.7; }
.compressor-combined-graph-wrap { width:100%; overflow:hidden; border:1px solid rgba(232,160,77,.22); border-radius:12px; background:#141517; }
#compressorCombinedGraph { display:block; width:100%; height:360px; cursor:ns-resize; }
.compressor-primary-controls { grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
.compressor-advanced { margin-top:12px; border:1px solid rgba(232,160,77,.18); border-radius:10px; background:rgba(255,255,255,.02); }
.compressor-advanced summary { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:13px 15px; color:#e8c49d; cursor:pointer; font-size:12px; font-weight:600; list-style:none; }
.compressor-advanced summary::-webkit-details-marker { display:none; }
.compressor-advanced summary::after { content:"＋"; color:#ffb15f; font-size:16px; }
.compressor-advanced[open] summary::after { content:"−"; }
.compressor-advanced-controls { grid-template-columns:repeat(3,minmax(0,1fr)); padding:0 12px 12px; }
@media(max-width:760px) { .compressor-primary-controls,.compressor-advanced-controls { grid-template-columns:1fr; } .compressor-meter-row { grid-template-columns:1fr 1fr; } .compressor-meter-card { grid-column:1/-1; } }


/* =========================================
   GAIN STAGE — MIXER / LEVEL METERS
========================================= */
.gain-lab{margin:28px 0 36px}
.gain-lab-heading{margin:0 0 18px}
.gain-eyebrow{display:block;margin-bottom:8px;color:var(--orange);font:700 10px 'Montserrat',sans-serif;letter-spacing:1.6px}
.gain-lab-heading h2{margin:0 0 8px;color:#f1dfca;font-size:25px;font-weight:500}
.gain-lab-heading p{margin:0;color:var(--muted);font-size:13px;line-height:1.8}
.gain-definition-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
.gain-definition{padding:16px;background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:12px}
.gain-definition strong{display:block;margin-bottom:8px;color:var(--orange);font:700 12px 'Montserrat',sans-serif;letter-spacing:1px}
.gain-definition p{margin:0;font-size:13px;line-height:1.8}
.gain-console{padding:22px;background:linear-gradient(145deg,#282720,#1d1c19);border:1px solid rgba(232,160,77,.35);border-radius:18px;box-shadow:0 12px 35px rgba(0,0,0,.22)}
.gain-console-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:16px;border-bottom:1px solid rgba(232,160,77,.2);color:#e7d7c4;font:700 10px 'Montserrat',sans-serif;letter-spacing:1.2px}
.gain-live-dot{display:inline-block;width:7px;height:7px;margin-right:8px;background:#61d49a;border-radius:50%;box-shadow:0 0 10px rgba(97,212,154,.65)}
.gain-console-tag{color:var(--muted);font-size:9px}
.gain-meter-grid{display:grid;grid-template-columns:minmax(0,1fr) 35px minmax(0,1fr);gap:12px;align-items:center;padding:22px 4px 18px}
.gain-meter-channel{min-width:0;padding:15px 12px 12px;background:#151614;border:1px solid rgba(255,255,255,.07);border-radius:12px}
.gain-meter-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;color:#f0dfca;font:700 12px 'Montserrat',sans-serif;letter-spacing:1px}
.gain-meter-title small{color:#9d907e;font-size:9px;font-weight:500}
.gain-meter-body{display:grid;grid-template-columns:25px minmax(0,1fr) 65px;gap:8px;align-items:stretch;height:230px}
.gain-scale{display:flex;flex-direction:column;justify-content:space-between;padding:1px 0;color:#827c70;font:9px 'Montserrat',sans-serif;text-align:right}
.gain-led-meter{display:flex;flex-direction:column-reverse;justify-content:flex-start;gap:3px;min-width:0;padding:5px;background:#0d0f0e;border:1px solid #30332d;border-radius:5px;overflow:hidden}
.gain-led-meter i{display:block;flex:1;min-height:3px;background:#29332b;border-radius:1px;transition:background .07s,box-shadow .07s}
.gain-led-meter i.lit{background:#39b86f;box-shadow:0 0 5px rgba(57,184,111,.35)}
.gain-led-meter i.hot{background:#d5b83d;box-shadow:0 0 5px rgba(213,184,61,.3)}
.gain-led-meter i.red{background:#dc5147;box-shadow:0 0 6px rgba(220,81,71,.4)}
.gain-meter-readout{display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding-bottom:2px}
.gain-meter-readout strong{color:#8ce0a9;font:600 17px 'Montserrat',sans-serif;font-variant-numeric:tabular-nums;white-space:nowrap}
.gain-meter-readout small{margin-top:4px;color:#8f887d;font:9px 'Montserrat',sans-serif}
.gain-meter-foot{margin-top:10px;color:#938a7e;font-size:10px;text-align:center}
.gain-flow-arrow{color:var(--orange);font-size:26px;text-align:center}
.gain-status-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:0 0 20px}
.gain-status-cell{display:flex;flex-direction:column;gap:6px;padding:12px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.06);border-radius:9px}
.gain-status-cell span{color:#9c907f;font:600 9px 'Montserrat',sans-serif;letter-spacing:.8px}
.gain-status-cell strong{color:#e8c18f;font:600 15px 'Montserrat',sans-serif;font-variant-numeric:tabular-nums}
.gain-clip-cell strong{color:#6dd494}
.gain-clip-cell.clipping{background:rgba(184,48,39,.15);border-color:rgba(231,78,66,.65)}
.gain-clip-cell.clipping strong{color:#ff665c}
.gain-control-area{padding:18px 18px 16px;background:rgba(0,0,0,.2);border:1px solid rgba(232,160,77,.18);border-radius:12px}
.gain-control-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}
.gain-control-heading label{color:#e8d5bd;font:700 11px 'Montserrat',sans-serif;letter-spacing:1px}
.gain-control-heading output{color:var(--orange);font:700 21px 'Montserrat',sans-serif;font-variant-numeric:tabular-nums}
.gain-slider{display:block;width:100%;accent-color:#e5a354;cursor:pointer}
.gain-range-labels{display:flex;justify-content:space-between;margin-top:5px;color:#928777;font:9px 'Montserrat',sans-serif}
.gain-presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
.gain-presets button{padding:8px 13px;background:#292821;border:1px solid rgba(232,160,77,.22);border-radius:7px;color:#d8c9b6;font:600 10px 'Montserrat',sans-serif;cursor:pointer;transition:.2s}
.gain-presets button:hover,.gain-presets button.active{background:rgba(232,160,77,.16);border-color:var(--orange);color:#ffd09c}
.gain-note{margin:13px 2px 0;color:var(--muted);font-size:11px;line-height:1.8}
.gain-note strong{color:#e6bd8c}
@media(max-width:650px){
 .gain-definition-grid{grid-template-columns:1fr}
 .gain-console{padding:14px}
}


/* =========================================
   UPDATED COMPACT FILTER & SHARED AUDIO BAR
========================================= */
.lab-audio-bar {
  margin-bottom: 16px;
  padding: 13px 15px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(232, 160, 77, 0.25);
  border-radius: 12px;
}

.lab-audio-top {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.lab-audio-info {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.lab-audio-badge {
  padding: 3px 8px;
  background: rgba(255, 157, 67, 0.16);
  border: 1px solid rgba(255, 157, 67, 0.4);
  border-radius: 6px;
  color: #ffad59;
  font: 700 10px 'Montserrat', sans-serif;
  letter-spacing: 1px;
  white-space: nowrap;
}

.lab-audio-name {
  color: #e9d9c8;
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.lab-upload-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: #17130f;
  border: 1px solid rgba(232, 160, 77, 0.45);
  border-radius: 8px;
  color: #ffd09c;
  font-size: 12px;
  cursor: pointer;
  transition: 0.2s;
  white-space: nowrap;
}

.lab-upload-btn:hover {
  border-color: #ff9d43;
  background: rgba(255, 157, 67, 0.12);
}

.lab-upload-input {
  display: none;
}

.filter-compact-controls {
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 12px;
  margin-top: 14px;
}

.filter-compact-controls .filter-control {
  padding: 12px 14px;
}

.fx-lab-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 12px;
  margin-top: 14px;
}

@media (max-width: 600px) {
  .filter-compact-controls {
    grid-template-columns: 1fr;
    gap: 10px;
  }
}


/* =========================================
   REVERB 3D SPATIAL VISUALIZER LAB
========================================= */
.reverb-theory-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
  margin-top: 14px;
}

.reverb-compare-box {
  padding: 15px 17px;
  background: rgba(255, 255, 255, 0.025);
  border: 1px solid rgba(232, 160, 77, 0.25);
  border-radius: 12px;
}

.reverb-compare-box h4 {
  margin: 0 0 6px;
  color: #ffad59;
  font-size: 15px;
}

.reverb-compare-box p {
  margin: 0;
  font-size: 13px;
  line-height: 1.8;
}

.reverb-role-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
  margin-top: 12px;
}

.reverb-role-item {
  padding: 14px 15px;
  background: rgba(255, 255, 255, 0.02);
  border-left: 3px solid var(--orange);
  border-radius: 6px 10px 10px 6px;
}

.reverb-role-item strong {
  display: block;
  margin-bottom: 5px;
  color: #f4bd87;
  font-size: 13px;
}

.reverb-role-item span {
  display: block;
  color: #d9cec2;
  font-size: 12.5px;
  line-height: 1.75;
}

.reverb-param-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-top: 12px;
}

.reverb-param-card {
  padding: 15px 16px;
  background: rgba(255, 255, 255, 0.025);
  border: 1px solid rgba(232, 160, 77, 0.18);
  border-radius: 12px;
}

.reverb-param-card h4 {
  margin: 0 0 6px;
  color: var(--orange);
  font-size: 15px;
}

.reverb-param-card p {
  margin: 0 0 8px;
  font-size: 13px;
  line-height: 1.75;
}

.reverb-param-sub {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-top: 8px;
  border-top: 1px solid rgba(255, 157, 67, 0.15);
  font-size: 12px;
  color: #cbbba9;
}

.reverb-param-sub b {
  color: #ffd09c;
  font-weight: 500;
}

.reverb-canvas-shell {
  position: relative;
  width: 100%;
  height: 360px;
  background: #141210;
  border: 1px solid rgba(232, 160, 77, 0.28);
  border-radius: 14px;
  overflow: hidden;
  cursor: grab;
  user-select: none;
  touch-action: none;
}

.reverb-canvas-shell:active {
  cursor: grabbing;
}

#reverb3dCanvas {
  display: block;
  width: 100%;
  height: 100%;
}

.reverb-canvas-axis {
  position: absolute;
  left: 14px;
  top: 12px;
  bottom: 12px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  pointer-events: none;
  color: #8b7b6a;
  font: 600 9px 'Montserrat', sans-serif;
  letter-spacing: 0.8px;
}

.reverb-canvas-hint {
  position: absolute;
  left: 14px;
  bottom: 12px;
  padding-left: 52px;
  pointer-events: none;
  color: #9e8d7b;
  font-size: 11px;
}

.reverb-canvas-hud {
  position: absolute;
  right: 16px;
  bottom: 12px;
  text-align: right;
  pointer-events: none;
}

.reverb-canvas-hud small {
  display: block;
  color: #9e8d7b;
  font: 700 9px 'Montserrat', sans-serif;
  letter-spacing: 1.2px;
}

.reverb-canvas-hud strong {
  color: #ffad59;
  font: 700 17px 'Montserrat', sans-serif;
  text-shadow: 0 0 12px rgba(255, 157, 67, 0.35);
}

.reverb-legend-row {
  display: flex;
  flex-wrap: wrap;
  gap: 14px 20px;
  margin: 12px 2px 16px;
  color: #bba996;
  font-size: 11px;
}

.reverb-legend-row span {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}

.reverb-legend-row i {
  display: inline-block;
  width: 14px;
  height: 3px;
  border-radius: 3px;
}

.reverb-controls-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}

.reverb-summary-box {
  margin-top: 16px;
  padding: 16px;
  background: rgba(255, 255, 255, 0.025);
  border: 1px solid rgba(232, 160, 77, 0.22);
  border-radius: 13px;
}

.reverb-summary-head {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 13px;
}

.reverb-summary-title {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #f0c18e;
  font: 600 13px 'Kanit', 'Montserrat', sans-serif;
}

.reverb-summary-title i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ff9d43;
  box-shadow: 0 0 8px rgba(255, 157, 67, 0.7);
}

.reverb-space-badge {
  padding: 5px 11px;
  background: rgba(255, 157, 67, 0.14);
  border: 1px solid rgba(255, 157, 67, 0.45);
  border-radius: 7px;
  color: #ffd09c;
  font: 700 11px 'Montserrat', sans-serif;
  letter-spacing: 0.6px;
}

.reverb-summary-cards {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.reverb-stat-card {
  padding: 12px 13px;
  background: #171411;
  border: 1px solid rgba(232, 160, 77, 0.16);
  border-radius: 10px;
}

.reverb-stat-card > span {
  display: block;
  margin-bottom: 6px;
  color: #a99886;
  font-size: 11px;
}

.reverb-stat-main {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 6px;
  margin-bottom: 5px;
}

.reverb-stat-main strong {
  color: #ffad59;
  font: 700 15px 'Montserrat', sans-serif;
}

.reverb-stat-main em {
  font-style: normal;
  color: #e7c49d;
  font-size: 11px;
}

.reverb-stat-card small {
  display: block;
  color: #9c8d7d;
  font-size: 10.5px;
  line-height: 1.5;
}

@media (max-width: 900px) {
  .reverb-controls-grid,
  .reverb-summary-cards {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 650px) {
  .reverb-theory-grid,
  .reverb-param-grid,
  .reverb-controls-grid,
  .reverb-summary-cards {
    grid-template-columns: 1fr;
  }
  .reverb-canvas-shell {
    height: 300px;
  }
}


/* =========================================
   DELAY INTERACTIVE VISUALIZER LAB
========================================= */
.delay-param-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-top: 12px;
}

.delay-canvas-shell {
  position: relative;
  width: 100%;
  height: 340px;
  background: #13110f;
  border: 1px solid rgba(232, 160, 77, 0.28);
  border-radius: 14px;
  overflow: hidden;
}

#delayTapCanvas {
  display: block;
  width: 100%;
  height: 100%;
}

.delay-legend-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 20px;
  margin: 12px 2px 16px;
  color: #bba996;
  font-size: 11.5px;
}

.delay-legend-row span {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}

.delay-legend-row i {
  display: inline-block;
  width: 14px;
  height: 3px;
  border-radius: 3px;
}

.delay-time-box {
  padding: 16px 18px;
  background: rgba(255, 255, 255, 0.025);
  border: 1px solid rgba(232, 160, 77, 0.22);
  border-radius: 13px;
  margin-bottom: 12px;
}

.delay-time-header {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.delay-time-title {
  display: flex;
  align-items: baseline;
  gap: 10px;
  color: #f4e7d9;
  font-size: 15px;
  font-weight: 500;
}

.delay-time-title output {
  color: var(--orange);
  font: 700 16px 'Montserrat', sans-serif;
}

.delay-mode-toggle {
  display: inline-flex;
  padding: 3px;
  background: #161310;
  border: 1px solid rgba(232, 160, 77, 0.3);
  border-radius: 10px;
  gap: 4px;
}

.delay-mode-btn {
  padding: 6px 13px;
  background: transparent;
  border: none;
  border-radius: 7px;
  color: #bca995;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: 0.2s;
}

.delay-mode-btn:hover {
  color: #ffd09c;
}

.delay-mode-btn.active {
  background: var(--orange);
  color: #1f140a;
  font-weight: 600;
}

.delay-subline {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  color: #cbbba9;
  font-size: 12.5px;
}

.delay-subline output {
  color: #67d4e8;
  font: 600 12.5px 'Montserrat', sans-serif;
}

.delay-time-box input[type="range"] {
  width: 100%;
  accent-color: var(--orange);
  cursor: pointer;
}

.delay-note-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 8px;
  margin-top: 14px;
}

.delay-note-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 10px 6px;
  background: #171411;
  border: 1px solid rgba(232, 160, 77, 0.2);
  border-radius: 10px;
  color: #d9cec2;
  cursor: pointer;
  transition: 0.2s;
}

.delay-note-btn:hover {
  border-color: rgba(255, 157, 67, 0.55);
  background: rgba(255, 157, 67, 0.08);
}

.delay-note-btn.active {
  border-color: var(--orange);
  background: rgba(255, 157, 67, 0.16);
  color: #ffd09c;
  box-shadow: 0 0 12px rgba(255, 157, 67, 0.16);
}

.delay-note-btn .note-sym {
  font-size: 15px;
  color: var(--orange);
  line-height: 1.1;
}

.delay-note-btn .note-th {
  font-size: 12px;
  font-weight: 500;
}

.delay-note-btn .note-val {
  font: 600 10px 'Montserrat', sans-serif;
  color: #9e8d7b;
}

.delay-note-btn.active .note-val {
  color: #f4bd87;
}

.delay-formula-bar {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  padding: 10px 14px;
  background: #15120f;
  border: 1px solid rgba(232, 160, 77, 0.16);
  border-radius: 9px;
  font-size: 12px;
  color: #a99886;
}

.delay-formula-bar strong {
  color: #ff9d43;
  font: 600 12px 'Montserrat', sans-serif;
}

.delay-bottom-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.delay-param-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 8px;
  font-size: 12px;
  color: #cbbba9;
}

.delay-param-meta output.pink {
  color: #ff6fb5;
  font: 600 12px 'Montserrat', sans-serif;
}

.delay-param-meta output.mint {
  color: #5ce0a8;
  font: 600 12px 'Montserrat', sans-serif;
}

@media (max-width: 820px) {
  .delay-param-grid {
    grid-template-columns: 1fr;
  }
  .delay-note-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 600px) {
  .delay-bottom-grid {
    grid-template-columns: 1fr;
  }
  .delay-canvas-shell {
    height: 290px;
  }
}


/* =========================================
   PITCH SHIFTER LESSON + VISUALIZER LAB
========================================= */
.pitch-freq-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-top: 12px;
}

.pitch-freq-box {
  padding: 14px 16px;
  background: rgba(255, 255, 255, 0.025);
  border-left: 3px solid var(--gold);
  border-radius: 6px 10px 10px 6px;
}

.pitch-freq-box strong {
  display: block;
  margin-bottom: 4px;
  color: #ffd09c;
  font-size: 14px;
}

.pitch-freq-box span {
  display: block;
  color: #d9cec2;
  font-size: 13px;
  line-height: 1.7;
}

.pitch-param-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 12px;
  margin-top: 12px;
}

.pitch-semi-chips {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 7px;
  margin-top: 10px;
}

.pitch-chip {
  padding: 8px 10px;
  background: #171411;
  border: 1px solid rgba(232, 160, 77, 0.22);
  border-radius: 8px;
}

.pitch-chip b {
  display: block;
  color: #ffad59;
  font: 600 11.5px 'Montserrat', sans-serif;
  margin-bottom: 2px;
}

.pitch-chip span {
  display: block;
  color: #cbbba9;
  font-size: 11.5px;
  line-height: 1.4;
}

.pitch-canvas-shell {
  position: relative;
  width: 100%;
  height: 360px;
  background: #12100d;
  border: 1px solid rgba(232, 160, 77, 0.28);
  border-radius: 14px;
  overflow: hidden;
}

#pitchShiftCanvas {
  display: block;
  width: 100%;
  height: 100%;
}

.pitch-legend-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 10px 18px;
  margin: 12px 2px 16px;
  color: #bba996;
  font-size: 11.5px;
}

.pitch-legend-items {

function bindAudioSourceLoader(prefix, audio, statusEl) {
  const fileInput = document.getElementById(`${prefix}AudioFile`);
  const fileNameEl = document.getElementById(`${prefix}FileName`);
  let objectUrl = null;
  let triedFallback = false;

  audio.addEventListener("error", () => {
    if (!triedFallback && audio.src.includes("sound1.wav")) {
      triedFallback = true;
      audio.src = "assets/filter-demo.wav";
      if (fileNameEl) fileNameEl.textContent = "filter-demo.wav";
      audio.load();
    } else if (statusEl) {
      statusEl.textContent = "ไม่พบไฟล์ assets/sound1.wav กรุณากดปุ่ม 'เลือกไฟล์เสียงจากอุปกรณ์' ด้านบน";
    }
  });

  if (fileInput) {
    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(file);
      audio.src = objectUrl;
      audio.load();
      if (fileNameEl) fileNameEl.textContent = file.name;
      if (statusEl) statusEl.textContent = `โหลดไฟล์เสียงแล้ว: ${file.name}`;
    });
  }
}

function initFilterLab() {
  const canvas = document.getElementById("filterResponseChart");
  const ctx = canvas.getContext("2d");
  const typeSelect = document.getElementById("filterType");
  const slopeInput = document.getElementById("filterSlope");
  const audio = document.getElementById("filterDemoAudio");
  const playButton = document.getElementById("filterPlayPause");
  const seek = document.getElementById("filterAudioSeek");
  const timeLabel = document.getElementById("filterAudioTime");
  const audioStatus = document.getElementById("filterAudioStatus");
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;

  let audioContext = null;
  let sourceNode = null;
  let filterNodes = [];
  let analyser = null;
  let spectrumData = null;
  let animFrame = 0;
  let draggingMarker = null;

  const minFreq = 20, maxFreq = 20000, minDb = -60, maxDb = 12, points = 900;
  let lowerFreq = 1000;
  let upperFreq = 3000;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const fmtHz = (v) => `${Math.round(v).toLocaleString("en-US")} Hz`;
  const fmtTime = (t) => {
    if (!Number.isFinite(t)) return "0:00";
    const m = Math.floor(t / 60), sec = Math.floor(t % 60);
    return `${m}:${String(sec).padStart(2, "0")}`;
  };
  const stages = () => Number(slopeInput.value) / 12;

  bindAudioSourceLoader("filter", audio, audioStatus);

  try {
    if (AudioContextClass) audioContext = new AudioContextClass();
    if (audioContext) {
      sourceNode = audioContext.createMediaElementSource(audio);
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 4096;
      analyser.smoothingTimeConstant = 0.8;
      spectrumData = new Float32Array(analyser.frequencyBinCount);
      rebuildAudioChain();
    }
  } catch (err) {
    console.warn("Web Audio setup failed", err);
    audioStatus.textContent = "เบราว์เซอร์ไม่รองรับ Web Audio API ในหน้านี้";
  }

  function makeStages(kind, frequency, count) {
    return Array.from({ length: count }, () => {
      const node = audioContext.createBiquadFilter();
      node.type = kind;
      node.frequency.value = frequency;
      node.Q.value = 0.7071;
      return node;
    });
  }

  function disconnectFilters() {
    filterNodes.forEach((node) => { try { node.disconnect(); } catch (_) {} });
    filterNodes = [];
  }

  function rebuildAudioChain() {
    if (!audioContext || !sourceNode) return;
    disconnectFilters();
    const count = stages();
    const type = typeSelect.value;
    if (type === "lowpass") filterNodes = makeStages("lowpass", lowerFreq, count);
    if (type === "highpass") filterNodes = makeStages("highpass", lowerFreq, count);
    if (type === "bandpass") filterNodes = [
      ...makeStages("highpass", lowerFreq, count),
      ...makeStages("lowpass", upperFreq, count)
    ];
    sourceNode.disconnect();
    let previous = sourceNode;
    filterNodes.forEach((node) => { previous.connect(node); previous = node; });
    if (analyser) {
      previous.connect(analyser);
      analyser.connect(audioContext.destination);
    } else {
      previous.connect(audioContext.destination);
    }
  }

  function getResponseDb(freqs) {
    const type = typeSelect.value;
    const order = stages() * 2;
    const db = new Float32Array(freqs.length);
    for (let i = 0; i < freqs.length; i++) {
      const f = freqs[i];
      let magSq = 1;
      if (type === "lowpass") {
        magSq = 1 / (1 + Math.pow(f / lowerFreq, 2 * order));
      } else if (type === "highpass") {
        magSq = 1 / (1 + Math.pow(lowerFreq / f, 2 * order));
      } else if (type === "bandpass") {
        const hpSq = 1 / (1 + Math.pow(lowerFreq / f, 2 * order));
        const lpSq = 1 / (1 + Math.pow(f / upperFreq, 2 * order));
        magSq = hpSq * lpSq;
      }
      db[i] = 10 * Math.log10(Math.max(magSq, 1e-12));
    }
    return db;
  }

  function drawGraph() {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width) return;
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const width = rect.width, height = 340;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const pad = { left: 52, right: 16, top: 18, bottom: 38 };
    const plotW = width - pad.left - pad.right;
    const plotH = height - pad.top - pad.bottom;
    const xFor = (f) => pad.left + Math.log10(f / minFreq) / Math.log10(maxFreq / minFreq) * plotW;
    const yFor = (db) => pad.top + ((maxDb - clamp(db, minDb, maxDb)) / (maxDb - minDb)) * plotH;

    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = "#141517";
    ctx.fillRect(0, 0, width, height);

    ctx.font = "10px Montserrat, sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    for (let db = -60; db <= 0; db += 12) {
      const y = yFor(db);
      ctx.strokeStyle = db === 0 ? "rgba(255,255,255,0.16)" : "rgba(255,255,255,0.06)";
      ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(width - pad.right, y); ctx.stroke();
      ctx.fillStyle = "#9c9389";
      ctx.fillText(`${db} dB`, pad.left - 8, y);
    }

    const ticks = [20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000];
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ticks.forEach((f) => {
      const x = xFor(f);
      ctx.strokeStyle = "rgba(255,255,255,0.06)";
      ctx.beginPath(); ctx.moveTo(x, pad.top); ctx.lineTo(x, pad.top + plotH); ctx.stroke();
      ctx.fillStyle = "#9c9389";
      ctx.fillText(f >= 1000 ? `${f / 1000}k` : `${f}`, x, pad.top + plotH + 9);
    });

    if (analyser && spectrumData && !audio.paused && !audio.ended) {
      analyser.getFloatFrequencyData(spectrumData);
      const binHz = audioContext.sampleRate / analyser.fftSize;
      const specPoints = [];
      for (let i = 1; i < spectrumData.length; i++) {
        const hz = i * binHz;
        if (hz < minFreq || hz > maxFreq) continue;
        const rawDb = Number.isFinite(spectrumData[i]) ? spectrumData[i] : -100;
        const norm = clamp((rawDb + 95) / 85, 0, 1);
        const y = pad.top + plotH - norm * (plotH * 0.82);
        specPoints.push([xFor(hz), y]);
      }

      if (specPoints.length > 1) {
        const specGrad = ctx.createLinearGradient(pad.left, 0, width - pad.right, 0);
        specGrad.addColorStop(0.0, "rgba(255, 130, 67, 0.42)");
        specGrad.addColorStop(0.5, "rgba(255, 185, 80, 0.36)");
        specGrad.addColorStop(1.0, "rgba(86, 224, 210, 0.38)");

        ctx.beginPath();
        ctx.moveTo(specPoints[0][0], pad.top + plotH);
        specPoints.forEach(([x, y]) => ctx.lineTo(x, y));
        ctx.lineTo(specPoints[specPoints.length - 1][0], pad.top + plotH);
        ctx.closePath();
        ctx.fillStyle = specGrad;
        ctx.fill();

        ctx.beginPath();
        specPoints.forEach(([x, y], idx) => idx === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
        ctx.strokeStyle = "rgba(255, 204, 128, 0.55)";
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }
    }

    const freqs = new Float32Array(points);
    for (let i = 0; i < points; i++) freqs[i] = minFreq * Math.pow(maxFreq / minFreq, i / (points - 1));
    const db = getResponseDb(freqs);

    ctx.beginPath();
    for (let i = 0; i < points; i++) {
      const x = xFor(freqs[i]), y = yFor(db[i]);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = "#ffad59";
    ctx.lineWidth = 2.6;
    ctx.shadowColor = "rgba(255, 173, 89, 0.45)";
    ctx.shadowBlur = 8;
    ctx.stroke();
    ctx.shadowBlur = 0;

    const markers = typeSelect.value === "bandpass"
      ? [{ f: lowerFreq, id: "lower" }, { f: upperFreq, id: "upper" }]
      : [{ f: lowerFreq, id: "lower" }];

    markers.forEach(({ f }) => {
      const x = xFor(f);
      const y = yFor(-14);
      ctx.beginPath();
      ctx.arc(x, y, 8, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(20, 21, 23, 0.65)";
      ctx.fill();
      ctx.lineWidth = 2.4;
      ctx.strokeStyle = "#ffd09c";
      ctx.stroke();
    });

    document.getElementById("filterSlopeValue").textContent = `${slopeInput.value} dB/oct`;
    document.getElementById("filterReadout").textContent = typeSelect.value === "bandpass"
      ? `BPF · ${fmtHz(lowerFreq)} – ${fmtHz(upperFreq)} · Slope ${slopeInput.value} dB/oct`
      : `${typeSelect.value === "lowpass" ? "LPF" : "HPF"} · ${fmtHz(lowerFreq)} · Slope ${slopeInput.value} dB/oct`;
  }

  function startAnimation() {
    cancelAnimationFrame(animFrame);
    const loop = () => {
      drawGraph();
      if (!audio.paused && !audio.ended) {
        animFrame = requestAnimationFrame(loop);
      }
    };
    animFrame = requestAnimationFrame(loop);
  }

  function updateAll() {
    rebuildAudioChain();
    drawGraph();
  }

  typeSelect.addEventListener("change", updateAll);
  slopeInput.addEventListener("input", updateAll);

  function pointerFrequency(event) {
    const rect = canvas.getBoundingClientRect(), pad = { left: 52, right: 16 };
    const plotW = rect.width - pad.left - pad.right;
    return minFreq * Math.pow(maxFreq / minFreq, clamp((event.clientX - rect.left - pad.left) / plotW, 0, 1));
  }

  function nearestMarker(event) {
    const rect = canvas.getBoundingClientRect(), pad = { left: 52, right: 16 }, plotW = rect.width - pad.left - pad.right;
    const xFor = (f) => pad.left + Math.log10(f / minFreq) / Math.log10(maxFreq / minFreq) * plotW;
    const x = event.clientX - rect.left;
    if (typeSelect.value !== "bandpass") return "lower";
    return Math.abs(x - xFor(lowerFreq)) <= Math.abs(x - xFor(upperFreq)) ? "lower" : "upper";
  }

  canvas.style.touchAction = "none";
  canvas.addEventListener("pointerdown", (e) => {
    draggingMarker = nearestMarker(e);
    canvas.setPointerCapture(e.pointerId);
    moveMarker(e);
  });
  canvas.addEventListener("pointermove", (e) => { if (draggingMarker) moveMarker(e); });
  canvas.addEventListener("pointerup", () => { draggingMarker = null; });
  canvas.addEventListener("pointercancel", () => { draggingMarker = null; });

  function moveMarker(e) {
    const f = clamp(pointerFrequency(e), minFreq, maxFreq);
    if (draggingMarker === "lower") lowerFreq = typeSelect.value === "bandpass" ? Math.min(f, upperFreq / 1.03) : f;
    if (draggingMarker === "upper") upperFreq = Math.max(f, lowerFreq * 1.03);
    lowerFreq = clamp(lowerFreq, 20, 19900);
    upperFreq = clamp(upperFreq, Math.max(21, lowerFreq * 1.03), 20000);
    updateAll();
  }

  playButton.addEventListener("click", async () => {
    if (!audioContext) return;
    try {
      if (audioContext.state === "suspended") await audioContext.resume();
      if (audio.paused) {
        await audio.play();
      } else {
        audio.pause();
      }
    } catch (err) {
      audioStatus.textContent = "กรุณาเลือกไฟล์เสียงจากอุปกรณ์ก่อนกด Play";
    }
  });

  audio.addEventListener("play", () => {
    playButton.textContent = "Ⅱ Pause";
    audioStatus.textContent = "กำลังเล่นเสียงผ่าน Filter · ลากจุดวงกลมบนกราฟเพื่อปรับความถี่ได้ทันที";
    startAnimation();
  });
  audio.addEventListener("pause", () => {
    playButton.textContent = "▶ Play";
    cancelAnimationFrame(animFrame);
    drawGraph();
  });
  audio.addEventListener("ended", () => {
    playButton.textContent = "▶ Play";
    seek.value = 0;
    cancelAnimationFrame(animFrame);
    drawGraph();
  });
  audio.addEventListener("loadedmetadata", () => {
    timeLabel.textContent = `0:00 / ${fmtTime(audio.duration)}`;
  });
  audio.addEventListener("timeupdate", () => {
    if (Number.isFinite(audio.duration) && audio.duration > 0) {
      seek.value = Math.round(audio.currentTime / audio.duration * 1000);
      timeLabel.textContent = `${fmtTime(audio.currentTime)} / ${fmtTime(audio.duration)}`;
    }
  });
  seek.addEventListener("input", () => {
    if (Number.isFinite(audio.duration) && audio.duration > 0) {
      audio.currentTime = (Number(seek.value) / 1000) * audio.duration;
    }
  });

  if ("ResizeObserver" in window) {
    new ResizeObserver(drawGraph).observe(canvas.parentElement);
  } else {
    window.addEventListener("resize", drawGraph);
  }
  updateAll();
}

  let prePathGain = null, postPathGain = null;
  let inputAnalyser = null, outputAnalyser = null, postSpectrumAnalyser = null;
  let inputSamples = null, outputSamples = null, postSamples = null;
  let preSpectrumData = null;
  let grHistory = new Array(140).fill(0);
  let animationId = 0, lastDraw = 0, smoothReduction = 0, draggingThresh = false;

  try {
    if (AudioContextClass) audioContext = new AudioContextClass();
    if (audioContext) {
      source = audioContext.createMediaElementSource(audio);
      compressor = audioContext.createDynamicsCompressor();
      makeupNode = audioContext.createGain();
      prePathGain = audioContext.createGain();
      postPathGain = audioContext.createGain();
      prePathGain.gain.value = 0;
      postPathGain.gain.value = 1;

      inputAnalyser = audioContext.createAnalyser();
      outputAnalyser = audioContext.createAnalyser();
      postSpectrumAnalyser = audioContext.createAnalyser();
      inputAnalyser.fftSize = postSpectrumAnalyser.fftSize = 4096;
      outputAnalyser.fftSize = 2048;
      inputAnalyser.smoothingTimeConstant = postSpectrumAnalyser.smoothingTimeConstant = 0.84;
      outputAnalyser.smoothingTimeConstant = 0.78;

      inputSamples = new Float32Array(inputAnalyser.fftSize);
      outputSamples = new Float32Array(outputAnalyser.fftSize);
      postSamples = new Float32Array(postSpectrumAnalyser.fftSize);
      preSpectrumData = new Float32Array(inputAnalyser.frequencyBinCount);

      source.connect(inputAnalyser);
      inputAnalyser.connect(prePathGain);
      prePathGain.connect(outputAnalyser);
      inputAnalyser.connect(compressor);
      compressor.connect(makeupNode);
      makeupNode.connect(postSpectrumAnalyser);
      postSpectrumAnalyser.connect(postPathGain);
      postPathGain.connect(outputAnalyser);
      outputAnalyser.connect(audioContext.destination);
    }
  } catch (error) {
    console.error('Compressor Web Audio setup failed:', error);
    status.textContent = 'ไม่สามารถเริ่ม Web Audio API ได้ในเบราว์เซอร์นี้';
  }

  function transfer(inputDb) {
    const t = Number(threshold.value), r = Number(ratio.value);
    const k = Number(knee.value), m = Number(makeup.value);
    let compressed = inputDb;
    if (k > 0 && inputDb > t - k / 2 && inputDb < t + k / 2) {
      const x = inputDb - t + k / 2;
      compressed = inputDb + (1 / r - 1) * x * x / (2 * k);
    } else if (inputDb >= t + k / 2) {
      compressed = t + (inputDb - t) / r;
    }
    return compressed + m;
  }

  function drawCombinedGraph() {
    const rect = canvas.getBoundingClientRect();
    const w = rect.width;
    if (!w) return;
    const h = 360;
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    ctx.fillStyle = '#141517';
    ctx.fillRect(0, 0, w, h);

    const pad = { left: 50, right: 18, top: 22, bottom: 34 };
    const plotW = w - pad.left - pad.right;
    const plotH = h - pad.top - pad.bottom;

    const minDb = -60, maxDb = 0;
    const xDb = db => pad.left + ((clamp(db, minDb, maxDb) - minDb) / (maxDb - minDb)) * plotW;
    const yDb = db => pad.top + ((maxDb - clamp(db, minDb, maxDb)) / (maxDb - minDb)) * plotH;

    ctx.font = '10px Montserrat, sans-serif';
    for (let db = -60; db <= 0; db += 12) {
      const y = yDb(db);
      ctx.strokeStyle = db === 0 ? 'rgba(255,255,255,0.18)' : 'rgba(255,255,255,0.06)';
      ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w - pad.right, y); ctx.stroke();
      ctx.fillStyle = '#9c9389';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(`${db} dB`, pad.left - 8, y);

      const x = xDb(db);
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.beginPath(); ctx.moveTo(x, pad.top); ctx.lineTo(x, pad.top + plotH); ctx.stroke();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(`${db}`, x, pad.top + plotH + 9);
    }

    if (inputAnalyser && preSpectrumData && audioContext && !audio.paused && !audio.ended) {
      inputAnalyser.getFloatFrequencyData(preSpectrumData);
      const minHz = 20, maxHz = 20000;
      const binHz = audioContext.sampleRate / inputAnalyser.fftSize;
      const specPts = [];
      for (let i = 1; i < preSpectrumData.length; i++) {
        const hz = i * binHz;
        if (hz < minHz || hz > maxHz) continue;
        const rawDb = Number.isFinite(preSpectrumData[i]) ? preSpectrumData[i] : -100;
        const norm = clamp((rawDb + 95) / 85, 0, 1);
        const sx = pad.left + (Math.log10(hz / minHz) / Math.log10(maxHz / minHz)) * plotW;
        const sy = pad.top + plotH - norm * (plotH * 0.78);
        specPts.push([sx, sy]);
      }
      if (specPts.length > 1) {
        ctx.beginPath();
        ctx.moveTo(specPts[0][0], pad.top + plotH);
        specPts.forEach(([sx, sy]) => ctx.lineTo(sx, sy));
        ctx.lineTo(specPts[specPts.length - 1][0], pad.top + plotH);
        ctx.closePath();
        ctx.fillStyle = 'rgba(130, 145, 165, 0.24)';
        ctx.fill();

        ctx.beginPath();
        specPts.forEach(([sx, sy], idx) => idx === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy));
        ctx.strokeStyle = 'rgba(165, 180, 200, 0.35)';
        ctx.lineWidth = 1.1;
        ctx.stroke();
      }
    }

    ctx.beginPath();
    ctx.moveTo(xDb(-60), yDb(-60));
    ctx.lineTo(xDb(0), yDb(0));
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
    ctx.lineWidth = 1.2;
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.setLineDash([]);

    const curvePts = [];
    for (let db = -60; db <= 0; db += 0.5) {
      const outDb = clamp(transfer(db), -60, 0);
      curvePts.push([xDb(db), yDb(outDb)]);
    }
    if (curvePts.length > 1) {
      const curveGrad = ctx.createLinearGradient(0, pad.top, 0, pad.top + plotH);
      curveGrad.addColorStop(0, 'rgba(255, 157, 67, 0.28)');
      curveGrad.addColorStop(1, 'rgba(255, 157, 67, 0.03)');

      ctx.beginPath();
      ctx.moveTo(curvePts[0][0], pad.top + plotH);
      curvePts.forEach(([cx, cy]) => ctx.lineTo(cx, cy));
      ctx.lineTo(curvePts[curvePts.length - 1][0], pad.top + plotH);
      ctx.closePath();
      ctx.fillStyle = curveGrad;
      ctx.fill();

      ctx.beginPath();
      curvePts.forEach(([cx, cy], idx) => idx === 0 ? ctx.moveTo(cx, cy) : ctx.lineTo(cx, cy));
      ctx.strokeStyle = '#ff9d43';
      ctx.lineWidth = 2.4;
      ctx.stroke();
    }

    const tVal = Number(threshold.value);
    const threshY = yDb(tVal);
    ctx.beginPath();
    ctx.moveTo(pad.left, threshY);
    ctx.lineTo(w - pad.right, threshY);
    ctx.strokeStyle = '#56e0ff';
    ctx.lineWidth = 1.8;
    ctx.stroke();

    const kneeX = xDb(tVal);
    const kneeY = yDb(clamp(transfer(tVal), -60, 0));
    ctx.beginPath();
    ctx.arc(kneeX, kneeY, 8, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(20, 21, 23, 0.8)';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#ffd09c';
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(kneeX, kneeY, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#ff9d43';
    ctx.fill();

    const maxGrRange = 24;
    const grYFor = grDb => pad.top + (clamp(grDb, 0, maxGrRange) / maxGrRange) * (plotH * 0.45);
    ctx.beginPath();
    for (let i = 0; i < grHistory.length; i++) {
      const gx = pad.left + (i / (grHistory.length - 1)) * plotW;
      const gy = grYFor(grHistory[i]);
      if (i === 0) ctx.moveTo(gx, gy); else ctx.lineTo(gx, gy);
    }
    ctx.strokeStyle = '#ff7eb6';
    ctx.lineWidth = 2.1;
    ctx.lineJoin = 'round';
    ctx.stroke();

    const currentGr = audio.paused ? 0 : Math.abs(Number(compressor?.reduction) || 0);
    const grText = currentGr > 0.01 ? `-${currentGr.toFixed(2)} dB` : '0.00 dB';
    ctx.font = '700 14px Montserrat, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillStyle = '#ff7eb6';
    ctx.shadowColor = 'rgba(0, 0, 0, 0.75)';
    ctx.shadowBlur = 4;
    ctx.fillText(grText, w - pad.right - 10, pad.top + plotH - 8);
    ctx.shadowBlur = 0;
  }

  function readRms(analyser, buffer) {
    if (!analyser || !buffer) return 0;
    analyser.getFloatTimeDomainData(buffer);
    let sum = 0;
    for (let i=0;i<buffer.length;i++) sum += buffer[i]*buffer[i];
    return Math.sqrt(sum / buffer.length);
  }

  function updateMeters() {
    if (!compressor || !audioContext || audio.paused || audio.ended) {
      smoothReduction = 0;
      reductionValue.textContent = '0.0 dB';
      reductionBar.style.width = '0%';
      if (audio.paused || audio.ended) {
        inputLevel.textContent = '-∞ dBFS';
        outputLevel.textContent = '-∞ dBFS';
      }
      return;
    }
    const target = Math.abs(Number(compressor.reduction) || 0);
    smoothReduction = smoothReduction * 0.75 + target * 0.25;
    grHistory.push(smoothReduction);
    if (grHistory.length > 140) grHistory.shift();

    reductionValue.textContent = `${smoothReduction.toFixed(1)} dB`;
    reductionBar.style.width = `${clamp(smoothReduction / 24 * 100, 0, 100)}%`;
    inputLevel.textContent = `${toDb(readRms(inputAnalyser,inputSamples)).toFixed(1)} dBFS`;
    outputLevel.textContent = `${toDb(readRms(postSpectrumAnalyser,postSamples)).toFixed(1)} dBFS`;
  }

  function animate() {
    if (animationId) cancelAnimationFrame(animationId);
    const frame = now => {
      if (audio.paused || audio.ended) {
        animationId = 0; updateMeters(); drawCombinedGraph(); return;
      }
      updateMeters();
      if (now - lastDraw >= 33) {
        drawCombinedGraph();
        lastDraw = now;
      }
      animationId = requestAnimationFrame(frame);
    };
    animationId = requestAnimationFrame(frame);
  }

  function applySettings() {
    const values = {
      threshold: Number(threshold.value), ratio: Number(ratio.value), knee: Number(knee.value),
      attack: Number(attack.value) / 1000, release: Number(release.value) / 1000,
      makeup: Number(makeup.value)
    };
    if (compressor && audioContext) {
      const now = audioContext.currentTime;
      compressor.threshold.setTargetAtTime(values.threshold, now, 0.015);
      compressor.ratio.setTargetAtTime(values.ratio, now, 0.015);
      compressor.knee.setTargetAtTime(values.knee, now, 0.015);
      compressor.attack.setTargetAtTime(values.attack, now, 0.015);
      compressor.release.setTargetAtTime(values.release, now, 0.015);
      makeupNode.gain.setTargetAtTime(Math.pow(10, values.makeup / 20), now, 0.015);
    }
    document.getElementById('compThresholdValue').textContent = `${values.threshold} dB`;
    document.getElementById('compRatioValue').textContent = `${values.ratio.toFixed(1).replace(/\.0$/,'')}:1`;
    document.getElementById('compKneeValue').textContent = `${values.knee} dB`;
    document.getElementById('compAttackValue').textContent = `${values.attack * 1000} ms`;
    document.getElementById('compReleaseValue').textContent = `${values.release * 1000} ms`;
    document.getElementById('compMakeupValue').textContent = `+${values.makeup.toFixed(1)} dB`;
    makeupSummary.textContent = `+${values.makeup.toFixed(1)} dB`;
    document.getElementById('compressorReadout').textContent =
      `Threshold ${values.threshold} dB · Ratio ${values.ratio.toFixed(1).replace(/\.0$/,'')}:1 · Make-up +${values.makeup.toFixed(1)} dB`;
    drawCombinedGraph();
  }

  function updateThresholdFromPointer(e) {
    const rect = canvas.getBoundingClientRect();
    const pad = { top: 22, bottom: 34 };
    const plotH = rect.height - pad.top - pad.bottom;
    const normY = clamp((e.clientY - rect.top - pad.top) / plotH, 0, 1);
    const db = Math.round(0 - normY * 60);
    threshold.value = clamp(db, -60, 0);
    applySettings();
  }
  canvas.style.touchAction = 'none';
  canvas.addEventListener('pointerdown', e => {
    draggingThresh = true;
    canvas.setPointerCapture(e.pointerId);
    updateThresholdFromPointer(e);
  });
  canvas.addEventListener('pointermove', e => { if (draggingThresh) updateThresholdFromPointer(e); });
  canvas.addEventListener('pointerup', () => { draggingThresh = false; });
  canvas.addEventListener('pointercancel', () => { draggingThresh = false; });

  function setMonitorMode(mode) {
    if (audioContext && prePathGain && postPathGain) {
      const now = audioContext.currentTime;
      prePathGain.gain.setTargetAtTime(mode === 'pre' ? 1 : 0, now, 0.01);
      postPathGain.gain.setTargetAtTime(mode === 'post' ? 1 : 0, now, 0.01);
    }
    preButton.classList.toggle('active', mode === 'pre');
    postButton.classList.toggle('active', mode === 'post');
    preButton.setAttribute('aria-pressed', String(mode === 'pre'));
    postButton.setAttribute('aria-pressed', String(mode === 'post'));
    modeDescription.textContent = mode === 'pre'
      ? 'PRE: ได้ยินเสียงต้นฉบับก่อนผ่าน Compressor (Bypass)'
      : 'POST: ได้ยินเสียงหลังถูกบีบอัดและเพิ่ม Make-up Gain แล้ว';
    drawCombinedGraph();
  }

  function setPreset(kind) {
    const presets = kind === 'over'
      ? { threshold: -36, ratio: 16, knee: 2, attack: 3, release: 90, makeup: 8 }
      : { threshold: -24, ratio: 4, knee: 12, attack: 10, release: 150, makeup: 0 };
    threshold.value = presets.threshold;
    ratio.value = presets.ratio;
    knee.value = presets.knee;
    attack.value = presets.attack;
    release.value = presets.release;
    makeup.value = presets.makeup;
    applySettings();
    characterDescription.textContent = kind === 'over'
      ? 'Overcompression: บีบอัดแรงด้วย Threshold ต่ำและ Ratio สูง แล้วชดเชยด้วย Make-up Gain มากขึ้น ลองฟังความแน่น/ความแบนของไดนามิก และสังเกต Gain Reduction ที่เพิ่มขึ้น'
      : 'Moderate: เริ่มจากการบีบอัดพอประมาณ เพื่อควบคุมเสียงที่ดังเกิน Threshold โดยยังคงความแตกต่างของไดนามิกไว้';
    drawCombinedGraph();
  }

  preButton.addEventListener('click', () => setMonitorMode('pre'));
  postButton.addEventListener('click', () => setMonitorMode('post'));
  document.getElementById('compNormalPreset').addEventListener('click', () => setPreset('normal'));
  document.getElementById('compOverPreset').addEventListener('click', () => setPreset('over'));
  [threshold, ratio, knee, attack, release, makeup].forEach(el => el.addEventListener('input', applySettings));

  play.addEventListener('click', async () => {
    if (!audioContext) { status.textContent = 'ไม่สามารถเริ่ม Web Audio API ได้'; return; }
    try {
      if (audioContext.state === 'suspended') await audioContext.resume();
      if (audio.paused) {
        await audio.play(); play.textContent = 'Ⅱ Pause';
        status.textContent = 'กำลังประมวลผลเสียงด้วย Compressor แบบเรียลไทม์ · ลากบนกราฟเพื่อปรับ Threshold ได้';
        animate();
      } else {
        audio.pause(); play.textContent = '▶ Play';
      }
    } catch (error) {
      console.error(error);
      status.textContent = 'เล่นเสียงไม่ได้ กรุณาเลือกไฟล์เสียงจากอุปกรณ์ก่อนกด Play';
    }
  });
  audio.addEventListener('play', () => {
    play.textContent = 'Ⅱ Pause';
    status.textContent = 'กำลังประมวลผลเสียงด้วย Compressor แบบเรียลไทม์ · ลากบนกราฟเพื่อปรับ Threshold ได้';
    animate();
  });
  audio.addEventListener('pause', () => {
    play.textContent = '▶ Play';
    if (animationId) { cancelAnimationFrame(animationId); animationId = 0; }
    updateMeters(); drawCombinedGraph();
  });
  audio.addEventListener('ended', () => {
    play.textContent = '▶ Play'; seek.value = 0;
    grHistory.fill(0);
    if (animationId) { cancelAnimationFrame(animationId); animationId = 0; }
    updateMeters(); drawCombinedGraph();
  });
  audio.addEventListener('loadedmetadata', () => { time.textContent = `0:00 / ${fmtTime(audio.duration)}`; });
  audio.addEventListener('timeupdate', () => {
    if (Number.isFinite(audio.duration) && audio.duration > 0) {
      seek.value = Math.round(audio.currentTime / audio.duration * 1000);
      time.textContent = `${fmtTime(audio.currentTime)} / ${fmtTime(audio.duration)}`;
    }
  });
  seek.addEventListener('input', () => {
    if (Number.isFinite(audio.duration) && audio.duration > 0) audio.currentTime = Number(seek.value) / 1000 * audio.duration;
  });

  if ('ResizeObserver' in window) {
    const observer = new ResizeObserver(drawCombinedGraph);
    observer.observe(canvas.parentElement);
  } else {
    window.addEventListener('resize', drawCombinedGraph);
  }
  applySettings();
  drawCombinedGraph();
}

function initGainStageLab() {
  const audio = document.getElementById("gainDemoAudio");
  const play = document.getElementById("gainPlayPause");
  const seek = document.getElementById("gainAudioSeek");
  const time = document.getElementById("gainAudioTime");
  const status = document.getElementById("gainAudioStatus");
  bindAudioSourceLoader("gain", audio, status);
  const slider = document.getElementById("gainAmount");
  const sliderValue = document.getElementById("gainAmountValue");
  const inputMeter = document.getElementById("gainInputMeter");
  const outputMeter = document.getElementById("gainOutputMeter");
  const inputDb = document.getElementById("gainInputDb");
  const outputDb = document.getElementById("gainOutputDb");
  const headroom = document.getElementById("gainHeadroom");
  const peakReadout = document.getElementById("gainPeak");
  const clipCell = document.getElementById("gainClipCell");
  const clipReadout = document.getElementById("gainClip");
  let context, source, inputAnalyser, outputAnalyser, gainNode;
  let inputData, outputData, raf = 0, peakHold = -Infinity, peakTimer = 0;
  let outputPeakHold = -Infinity;

  const fmtTime = value => {
    if (!Number.isFinite(value)) return "0:00";
    const m = Math.floor(value / 60);
    const sec = Math.floor(value % 60);
    return `${m}:${String(sec).padStart(2,"0")}`;
  };
  const db = value => value > 0.00001 ? 20 * Math.log10(value) : -Infinity;
  const fmtDb = value => Number.isFinite(value) ? `${value.toFixed(1)}` : "−∞";
  const setMeter = (element, level) => {
    const dbLevel = Math.max(-60, Math.min(0, level));
    const active = Math.round((dbLevel + 60) / 60 * 30);
    const segments = element.children;
    for (let i = 0; i < segments.length; i++) {
      const lit = i < active;
      segments[i].classList.toggle("lit", lit);
      segments[i].classList.toggle("hot", lit && i >= 24);
      segments[i].classList.toggle("red", lit && i >= 28);
    }
    element.setAttribute("aria-valuenow", Number.isFinite(level) ? Math.max(-60, Math.min(0, level)).toFixed(1) : "-60");
  };
  const makeSegments = element => {
    element.innerHTML = "";
    for (let i = 0; i < 30; i++) {
      const seg = document.createElement("i");
      element.appendChild(seg);
    }
  };
  makeSegments(inputMeter);
  makeSegments(outputMeter);

  function setupAudio() {
    if (context) return true;
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) {
      status.textContent = "เบราว์เซอร์นี้ไม่รองรับ Web Audio API";
      return false;
    }
    try {
      context = new AudioContextClass();
      source = context.createMediaElementSource(audio);
      inputAnalyser = context.createAnalyser();
      outputAnalyser = context.createAnalyser();
      inputAnalyser.fftSize = outputAnalyser.fftSize = 2048;
      inputAnalyser.smoothingTimeConstant = outputAnalyser.smoothingTimeConstant = 0.65;
      gainNode = context.createGain();
      source.connect(inputAnalyser);
      inputAnalyser.connect(gainNode);
      gainNode.connect(outputAnalyser);
      outputAnalyser.connect(context.destination);
      inputData = new Float32Array(inputAnalyser.fftSize);
      outputData = new Float32Array(outputAnalyser.fftSize);
      return true;
    } catch (error) {
      console.error(error);
      status.textContent = "เริ่มระบบเสียงไม่ได้ กรุณารีเฟรชหน้าเว็บแล้วลองอีกครั้ง";
      return false;
    }
  }

  function measure(analyser, data) {
    analyser.getFloatTimeDomainData(data);
    let sum = 0, peak = 0;
    for (let i = 0; i < data.length; i++) {
      const v = Math.abs(data[i]);
      if (v > peak) peak = v;
      sum += data[i] * data[i];
    }
    const rms = Math.sqrt(sum / data.length);
    return { rmsDb: db(rms), peakDb: db(peak), peak };
  }

  function drawMeters() {
    if (!context || audio.paused || audio.ended) {
      raf = 0;
      return;
    }
    const input = measure(inputAnalyser, inputData);
    const output = measure(outputAnalyser, outputData);
    setMeter(inputMeter, input.rmsDb);
    setMeter(outputMeter, output.rmsDb);
    inputDb.textContent = fmtDb(input.rmsDb);
    outputDb.textContent = fmtDb(output.rmsDb);
    headroom.textContent = Number.isFinite(output.peakDb) ? `${Math.max(0, -output.peakDb).toFixed(1)} dB` : "60+ dB";
    if (input.peakDb > peakHold) {
      peakHold = input.peakDb;
      peakTimer = performance.now();
    } else if (performance.now() - peakTimer > 1500) {
      peakHold = Math.max(input.peakDb, peakHold - 0.15);
    }
    if (output.peakDb > outputPeakHold) outputPeakHold = output.peakDb;
    else if (performance.now() - peakTimer > 1500) outputPeakHold = Math.max(output.peakDb, outputPeakHold - 0.15);
    peakReadout.textContent = `${fmtDb(outputPeakHold)} dBFS`;
    const clipping = output.peak >= 0.999;
    clipCell.classList.toggle("clipping", clipping);
    clipReadout.textContent = clipping ? "CLIPPING" : "SAFE";
    raf = requestAnimationFrame(drawMeters);
  }

  function updateGain() {
    const value = Number(slider.value);
    gainNode && (gainNode.gain.setTargetAtTime(Math.pow(10, value / 20), context.currentTime, 0.015));
    sliderValue.textContent = `${value > 0 ? "+" : ""}${value.toFixed(1)} dB`;
    document.querySelectorAll("[data-gain-preset]").forEach(button => {
      button.classList.toggle("active", Number(button.dataset.gainPreset) === value);
    });
    if (!audio.paused) status.textContent = `กำลังปรับ Gain ${value > 0 ? "+" : ""}${value.toFixed(1)} dB`;
  }

  slider.addEventListener("input", updateGain);
  document.querySelectorAll("[data-gain-preset]").forEach(button => {
    button.addEventListener("click", () => {
      slider.value = button.dataset.gainPreset;
      updateGain();
    });
  });

  play.addEventListener("click", async () => {
    if (!setupAudio()) return;
    try {
      if (context.state === "suspended") await context.resume();
      if (audio.paused) {
        await audio.play();
        play.textContent = "Ⅱ Pause";
        status.textContent = "กำลังแสดงระดับสัญญาณแบบเรียลไทม์";
        if (!raf) raf = requestAnimationFrame(drawMeters);
      } else {
        audio.pause();
      }
    } catch (error) {
      console.error(error);
      status.textContent = "เล่นเสียงไม่ได้ กรุณาตรวจสอบไฟล์เสียง";
    }
  });
  audio.addEventListener("play", () => {
    play.textContent = "Ⅱ Pause";
    if (!raf) raf = requestAnimationFrame(drawMeters);
  });
  audio.addEventListener("pause", () => {
    play.textContent = "▶ Play";
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
  });
  audio.addEventListener("ended", () => {
    play.textContent = "▶ Play";
    seek.value = 0;
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
  });
  audio.addEventListener("loadedmetadata", () => {
    time.textContent = `0:00 / ${fmtTime(audio.duration)}`;
  });
  audio.addEventListener("timeupdate", () => {
    if (audio.duration > 0) {
      seek.value = Math.round(audio.currentTime / audio.duration * 1000);
      time.textContent = `${fmtTime(audio.currentTime)} / ${fmtTime(audio.duration)}`;
    }
  });
  seek.addEventListener("input", () => {
    if (audio.duration > 0) audio.currentTime = Number(seek.value) / 1000 * audio.duration;
  });
  updateGain();
}
